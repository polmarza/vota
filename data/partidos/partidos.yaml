partidos:
  - id: psoe
    nombre: PSOE
    siglas: PSOE
    color: '#E30613'
    herencia:
      XIV:
        - diputados: ["Fuentes Curbelo, Juan Bernardo"]
          hasta: 2023-02-13
          justificacion: >-
            Jurado de IAs, segunda deliberación (data/jurado/herencia.json, 27-10-2026): el PSOE lo suspendió de militancia el 14-02-2023 (caso Mediador), el día de su última votación.
        - formaciones: [PSOE, PSC-PSOE, PsdeG-PSOE, PSE-EE-PSOE]
          grupos: [GS, ""]
          justificacion: >-
            Diputados elegidos en las listas del PSOE y sus federaciones, mientras votan desde el
            Grupo Socialista (o sin grupo todavía, los primeros días tras tomar posesión).
      XV:
        - formaciones: [PSOE, PSC-PSOE, PsdeG-PSOE, PSE-EE (PSOE), PSIB-PSOE, PSN-PSOE]
          grupos: [GS, ""]
          justificacion: >-
            Diputados elegidos en las listas del PSOE y sus federaciones, mientras votan desde el
            Grupo Socialista (o sin grupo todavía, los primeros días tras tomar posesión). Deja fuera los votos de Ábalos desde que pasó al Grupo Mixto
            (27-02-2024), tras salir del PSOE.

  - id: pp
    nombre: Partido Popular
    siglas: PP
    color: '#1D84CE'
    herencia:
      XIV:
