          justificacion: Diputados elegidos en las listas del PP.
        - diputados: ["Gázquez Collado, Paloma"]
          justificacion: Elegida en la lista PP-Foro por Asturias como diputada del PP; votó siempre desde el Grupo Popular.
        - diputados: ["Sayas López, Sergio"]
          desde: 2023-01-01
          justificacion: >-
            Jurado de IAs, segunda deliberación (data/jurado/herencia.json, 27-10-2026): en su última votación pertenecía al PP. El PP lo presentó como incorporación en diciembre de 2022; cuenta desde el mes siguiente.
          dudas: >-
            El jurado fijó el partido, no la fecha: el mes sale de sus razones.
      XV:
        - formaciones: [PP]
          justificacion: Diputados elegidos en las listas del PP.

