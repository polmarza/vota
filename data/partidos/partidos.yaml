# Herencia de los partidos: qué votos de la XIV y la XV cuentan como de cada partido.
# Formato en docs/data-model.md. Lo valida `pnpm data:partidos`.
#
# Códigos de grupo en las votaciones:
#   XIV: GS, GP, GVOX, GCUP-EC-GC (Unidas Podemos), GR (ERC), GCs, GV (EAJ-PNV), GEH Bildu,
#        GPlu (Plural), GMx (Mixto)
#   XV:  GS, GP, GVOX, GSUMAR, GR, GJxCAT, GEH Bildu, GV (EAJ-PNV), GMx
#
# Colores: aproximación a los oficiales; se verifican antes del lanzamiento.
#
# Estado: BORRADOR para el jurado (M-10). Las asignaciones de diputados de coalición salen de la
# biografía que publica el Congreso, del anexo de diputados de la Wikipedia y de prensa; las que
# no están claras llevan `dudas`.

alias:
  XV:
    "Cuesta Rodríguez, María del Socorro": "Cuesta Rodríguez, María"

coaliciones:
  XIV:
    - UP
    - ECP-GUANYEM EL CANVI
    - EC-UP
    - JxCat-JUNTS
    - NC-CCa-PNC
    - CCa-PNC-NC
    - NA+
    - PP-FORO
    - MÁS PAÍS-EQUO
    - ERC-S
  XV:
    - SUMAR

sinPartido:
