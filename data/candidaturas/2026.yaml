# Candidaturas al Congreso del 29-N por provincia (M-02), según las candidaturas proclamadas
# publicadas en el BOE núm. 273, de 3 de noviembre de 2026 (BOE-A-2026-23103), con la corrección
# del BOE núm. 278, de 7 de noviembre (BOE-A-2026-23383: en Navarra la lista es EH Bildu, sin ERC).
# Solo partidos con historial en la XIV o la XV. Un partido que va en coalición se muestra como
# partido individual en las provincias donde se presenta esa coalición; `listas` dice en cuál.
# No se presentan al Congreso: CUP y PRC. Podemos tiene representantes en las listas de ERC en
# Cataluña, pero no candidatura: allí no aparece. Formato en docs/data-model.md.

