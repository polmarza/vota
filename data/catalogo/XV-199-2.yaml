votacion: XV-199-2
url: "https://www.congreso.es/es/opendata/votaciones?p_p_id=votaciones&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&targetLegislatura=XV&targetDate=22/09/2026"
texto: https://www.congreso.es/public_oficiales/L15/CONG/BOCG/B/BOCG-15-B-117-1.PDF
iniciativa: "Proposición de ley del Grupo Mixto"
fecha: 2026-09-22
titulo_oficial: >-
  Proposición de Ley del Grupo Parlamentario Mixto, de jubilación sin penalización.
titulo: "Jubilación anticipada sin penalización"
resumen: >-
  Eliminaba los recortes de la pensión por jubilación anticipada para quien tiene 40 o más años
  cotizados, y permitía pedir el recálculo a quien ya se jubiló así. Se admitió a trámite.
que_significa_si: >-
  Votar sí era admitirla a trámite para que el Congreso la debatiera y pudiera aprobarla.
tema: pensiones
ambito: estatal
efectos:
  - cuando: { edad: [45-64], trabajo: [asalariado, autonomo, funcionario] }
    el_si: favorece
    justificacion: >-
      Quien trabaja y llega a los 40 años cotizados podría jubilarse antes sin que le recortaran
      la pensión.
    base: >-
      Artículo único, que modifica el art. 207 y siguientes de la Ley General de la Seguridad
      Social.
justificacion: >-
  Es la propuesta sobre jubilación anticipada de la XV, de un grupo distinto del Gobierno.
