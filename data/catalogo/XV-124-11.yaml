votacion: XV-124-11
url: "https://www.congreso.es/es/opendata/votaciones?p_p_id=votaciones&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&targetLegislatura=XV&targetDate=26/06/2025"
texto: https://www.boe.es/eli/es/rdl/2025/06/10/5
iniciativa: "Real decreto-ley del Gobierno"
fecha: 2025-06-26
titulo_oficial: >-
  Real Decreto-ley 5/2025, de 10 de junio, de medidas de promoción del uso del transporte público
  colectivo por parte de la juventud para los viajes realizados en el periodo estival de 2025.
titulo: "Verano Joven 2025"
resumen: >-
  Descuentos para los jóvenes nacidos entre 1995 y 2007 en los viajes de julio a septiembre de 2025:
  90 % en la media distancia de Renfe, 50 % en los Avant y descuentos en el tren comercial, en los
  autobuses estatales de larga distancia y en el pase Interrail. Se convalidó.
que_significa_si: >-
  Votar sí era convalidar el decreto ley, es decir, mantenerlo en vigor.
tema: transporte
ambito: estatal
efectos:
  - cuando: { edad: [menos-30] }
    el_si: favorece
    justificacion: >-
      Quien tiene menos de 30 años tuvo descuentos de hasta el 90 % en los viajes de tren y autobús del
      verano de 2025.
    base: >-
      Arts. 1 a 4 y 6 del Real Decreto-ley 5/2025.
justificacion: >-
  Es la edición de 2025 de los descuentos de transporte para jóvenes, una iniciativa distinta de la de
  2024 que ya está en el catálogo.
extracto: >-
  [Art. 1.1] «a) Haber nacido entre el 1 de enero de 1995 y el 31 de diciembre de 2007.» [Art. 1.2]
  «El descuento se aplicará sobre el precio de los billetes que tengan fecha de viaje entre el 1 de
  julio de 2025 y el 30 de septiembre de 2025.» [Art. 2.1] «un descuento del 90 % sobre el precio
  del billete sencillo y el billete de ida y vuelta en los servicios de transporte ferroviario de
  viajeros de media distancia» [Art. 2.2] «un descuento del 50 % en el precio de los billetes
  sencillos y los billetes de ida y vuelta de los servicios Avant.» [Art. 3.1] «un descuento del 50
  % en el precio ofertado en el momento de la compra en las tarifas comerciales de cada operador,
  con un descuento máximo de 30 euros por trayecto.» [Art. 4.1] «deberán aplicar, a las personas que
  cumplan los requisitos establecidos en el artículo 1, durante el periodo y con las condiciones
  establecidas en dicho artículo, un descuento del 90 % del precio en los billetes sencillos y en
  los billetes de ida y vuelta» [Art. 6.1] «un descuento del 50 % sobre el precio comercial en los
  pases Interrail»
