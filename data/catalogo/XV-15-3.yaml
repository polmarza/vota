votacion: XV-15-3
url: "https://www.congreso.es/es/opendata/votaciones?p_p_id=votaciones&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&targetLegislatura=XV&targetDate=10/01/2024"
texto: https://www.boe.es/eli/es/rdl/2023/12/19/7
iniciativa: "Real decreto-ley del Gobierno"
fecha: 2024-01-10
titulo_oficial: >-
  Real Decreto-ley 7/2023, de 19 de diciembre, por el que se adoptan medidas urgentes, para
  completar la transposición de la Directiva (UE) 2019/1158, del Parlamento Europeo y del Consejo,
  de 20 de junio de 2019, relativa a la conciliación de la vida familiar y la vida profesional de
  los progenitores y los cuidadores, y por la que se deroga la Directiva 2010/18/UE del Consejo, y
  para la simplificación y mejora del nivel asistencial de la protección por desempleo.
titulo: "Primera reforma del subsidio por desempleo"
resumen: >-
  Primera versión de la reforma del subsidio de desempleo: subía la cuantía en los primeros meses
  (95 % del IPREM los seis primeros), lo abría a colectivos antes excluidos, como los menores de 45
  años sin cargas familiares que hubieran agotado un paro de al menos 360 días, y lo hacía
  compatible con un empleo. A quienes empezaran a cobrar el subsidio de mayores de 52 años desde el
  1 de junio de 2024 les rebajaba de forma progresiva la base por la que se cotiza para la
  jubilación (120 % de la base mínima en 2024, hasta el 100 % desde 2028); quienes lo tenían
  reconocido antes mantenían el 125 %. También completaba la transposición de la directiva europea
  de conciliación, con derechos como acumular el permiso de lactancia en jornadas completas. El
  Congreso no lo convalidó.
que_significa_si: >-
  Votar sí era convalidar el decreto ley, es decir, mantenerlo en vigor.
tema: empleo
ambito: estatal
efectos:
  - cuando: { trabajo: [desempleo] }
    el_si: favorece
    justificacion: >-
      Quien está en paro podía cobrar un subsidio más alto los primeros meses y mantener una parte
      al encontrar trabajo.
    base: >-
      Art. segundo, que modifica los arts. 274 a 282 de la Ley General de la Seguridad Social.
justificacion: >-
  Es la versión de la reforma del subsidio que el Congreso tumbó.
extracto: >-
  [Exposición de motivos] «Se amplía la cobertura del nivel asistencial en algunos tramos de edad
  anteriormente excluidos, al permitir el acceso a los menores de 45 años sin responsabilidades
  familiares siempre que hayan agotado una prestación contributiva de 360 días» [Artículo primero,
  Uno (art. 37.4 ET)] «Quien ejerza este derecho, por su voluntad, podrá
  sustituirlo por una reducción de su jornada en media hora con la misma finalidad o acumularlo en
  jornadas completas.» [Artículo segundo, Cuatro (art. 274.1.a LGSS)] «Haber agotado la prestación
  por desempleo. En caso de ser menor de cuarenta y cinco años sin responsabilidades familiares se
  exigirá, además, que la prestación por desempleo agotada haya tenido una duración igual o
  superior a 360 días.» [Artículo segundo (art. 278.1 LGSS)] «La cuantía del subsidio será igual a
  los siguientes porcentajes del indicador público de rentas de efectos múltiples mensual vigente
  en cada momento: el 95 por ciento durante los ciento ochenta primeros días, el 90 por ciento
  desde el día ciento ochenta y uno al día trescientos sesenta, y el 80 por ciento a partir del
  día trescientos sesenta y uno.» [Artículo segundo (art. 282.3 LGSS)] «Quienes accedan al
  subsidio por desempleo manteniendo uno o varios contratos a tiempo parcial así como quienes
  siendo beneficiarios del subsidio por desempleo o del subsidio de mayores de 52 años se
  reincorporen al mercado laboral, ya sea porque pasen a estar contratados a tiempo completo o a
  tiempo parcial, el subsidio se convertirá en un complemento de apoyo al empleo.» [Artículo
  segundo (art. 280.9 LGSS)] «La entidad gestora cotizará por la contingencia de jubilación
  durante la percepción del subsidio por desempleo para trabajadores mayores de cincuenta y dos
  años. […] A efectos de determinar la cotización se tomará como base de cotización el 100 por
  cien de la base mínima de cotización en el Régimen General de la Seguridad Social, vigente en
  cada momento.» [Disposición transitoria tercera.1.a)] «Durante el ejercicio 2024 la base de
  cotización será equivalente al 120 por cien de la base mínima de cotización del Régimen General
  de la Seguridad Social vigente en cada momento.» [Disposición transitoria tercera.2] «Durante la
  percepción del subsidio para trabajadores mayores de cincuenta y dos años cuya fecha de
  nacimiento del derecho inicial sea anterior al día 1 de junio de 2024, la entidad gestora
  continuará cotizando por la contingencia de jubilación tomándose como base de cotización el 125
  por ciento del tope mínimo de cotización vigente en cada momento.»
