votacion: XIV-219-2
url: "https://www.congreso.es/es/opendata/votaciones?p_p_id=votaciones&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&targetLegislatura=XIV&targetDate=29/11/2022"
texto: https://www.congreso.es/public_oficiales/L14/CONG/BOCG/B/BOCG-14-B-272-1.PDF
iniciativa: "Proposición de ley del Grupo Popular"
fecha: 2022-11-29
titulo_oficial: >-
  Proposición de Ley del Grupo Parlamentario Popular en el Congreso, Orgánica contra la ocupación
  ilegal y para la convivencia vecinal y la protección de la seguridad de las personas y cosas en las
  comunidades de propietarios.
titulo: "Ley contra la ocupación del PP (2022)"
resumen: >-
  Obliga a quien ocupa un inmueble sin título a dejarlo en 24 horas cuando lo requiera la autoridad,
  con desalojo inmediato si no acredita su derecho, endurece las penas por ocupación y permite a
  cualquier propietario pedir la recuperación inmediata de su vivienda. También prohíbe empadronar a
  los ocupantes y deja a las comunidades de vecinos actuar contra ellos. No se admitió a trámite.
que_significa_si: >-
  Votar sí era admitirla a trámite para que el Congreso la debatiera y pudiera aprobarla.
tema: vivienda
ambito: estatal
efectos:
  - cuando: { vivienda: [propiedad, hipoteca] }
    el_si: favorece
    justificacion: >-
      Quien tiene una vivienda en propiedad podría recuperarla en 24 horas, con desalojo por la
      autoridad, si se la ocuparan sin título.
    base: >-
      Art. 3 (desalojo en 24 horas) y art. 5, dos (art. 250.1.4.º de la Ley de Enjuiciamiento Civil).
justificacion: >-
  Es la propuesta del PP contra la ocupación que se votó en la XIV; fija un procedimiento directo para
  que los propietarios recuperen sus viviendas.
