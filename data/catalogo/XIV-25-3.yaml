votacion: XIV-25-3
url: "https://www.congreso.es/es/opendata/votaciones?p_p_id=votaciones&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&targetLegislatura=XIV&targetDate=04/06/2020"
texto: https://www.congreso.es/public_oficiales/L14/CONG/BOCG/B/BOCG-14-B-72-1.PDF
iniciativa: "Proposición de ley del Grupo VOX"
fecha: 2020-06-04
titulo_oficial: >-
  Proposición de Ley del Grupo Parlamentario VOX, relativa a la efectiva igualdad y equiparación
  salarial de las Fuerzas y Cuerpos de Seguridad del Estado respecto de las Policías autonómicas.
titulo: "Equiparar el sueldo de policías y guardias civiles"
resumen: >-
  Proponía que el componente general del complemento específico de los funcionarios de carrera de
  la Policía Nacional y de la Guardia Civil no pudiera ser inferior al complemento específico que
  cobraran las policías autonómicas (el de mayor cuantía, si había varios), con la obligación de las
  comunidades de informar al Estado de lo que pagan a sus policías. Los policías y guardias civiles
  en segunda actividad o en reserva cobrarían el 80 % de esa equiparación. El Gobierno tendría tres
  meses para adaptar los complementos de destino a las titulaciones exigidas y revisar los de
  territorialidad y turnicidad, las dietas y las asistencias a juicios. No se admitió a trámite.
que_significa_si: >-
  Votar sí era admitirla a trámite para que el Congreso la debatiera y pudiera aprobarla.
tema: empleo
ambito: estatal
efectos:
  - cuando: { sector: [policia] }
    el_si: favorece
    justificacion: >-
      Quien es policía nacional o guardia civil tendría garantizado por ley un complemento específico
      no inferior al de las policías autonómicas, y el 80 % de esa equiparación si está en segunda
      actividad o en reserva.
    base: >-
      Artículos segundo y tercero y disposición adicional tercera de la proposición.
justificacion: >-
  Es una propuesta de un grupo distinto del Gobierno sobre el sueldo de los policías nacionales y
  guardias civiles, que ahora se identifican con la pregunta del sector.
extracto: >-
  [Artículo segundo] «Esta norma se aplicará a los funcionarios de carrera de la Policía Nacional
  definidos en la Ley Orgánica 9/2015, de 28 de julio, de Régimen de Personal de la Policía Nacional,
  y de la Guardia Civil, definidos en la Ley 29/2014, de 28 de noviembre, de Régimen del Personal de
  la Guardia Civil.» [Artículo tercero] «1. El componente general del complemento específico que se
  percibe en función del correspondiente empleo o categoría que se tenga, definido en el artículo
  4.B.b).1.º del Real Decreto 950/2005, de 29 de julio, de retribuciones de las Fuerzas y Cuerpos de
  Seguridad del Estado, aplicable al Cuerpo de la Guardia Civil y al Cuerpo Nacional de Policía, no
  podrá ser inferior al complemento específico que perciban las Policías Autonómicas. El de mayor
  cuantía, en caso de percibirse retribuciones diversas por parte de los funcionarios policiales
  autonómicos.» [Disposición adicional segunda] «El Gobierno, en el plazo de tres meses, procederá a
  modificar los complementos de territorialidad, turnicidad, así como los conceptos de dietas y
  asistencias a juicios a la realidad social y geográfica donde tengan impacto.» [Disposición
  adicional tercera] «Los Policías Nacionales y Guardias Civiles que estuvieren en segunda actividad
  o reserva percibirán la retribución correspondiente a la equiparación salarial abonada a los
  Policías Nacionales y Guardias Civiles en servicio activo en la proporción equivalente al 80 %.»
