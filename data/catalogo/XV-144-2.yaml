votacion: XV-144-2
url: "https://www.congreso.es/es/opendata/votaciones?p_p_id=votaciones&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&targetLegislatura=XV&targetDate=11/11/2025"
texto: https://www.congreso.es/public_oficiales/L15/CONG/BOCG/B/BOCG-15-B-263-1.PDF
iniciativa: "Proposición de ley del Grupo Republicano"
fecha: 2025-11-11
titulo_oficial: >-
  Proposición de Ley del Grupo Parlamentario Republicano, de medidas fiscales para combatir la
  especulación inmobiliaria.
titulo: "Impuesto a la compra de la tercera vivienda"
resumen: >-
  Proponía un impuesto adicional del 4 % al 12 % (y más) a la compra de vivienda por quien ya
  tiene dos o más, cobrar IVA a los alquileres de viviendas amuebladas de hasta 30 noches en municipios de 10.000
  habitantes o más, endurecer los
  requisitos de las SOCIMI y permitir a los ayuntamientos un recargo del IBI a grandes tenedores en zonas tensionadas.
  El Congreso no la admitió a trámite.
que_significa_si: >-
  Votar sí era tomarla en consideración, es decir, admitirla a trámite para debatirla y
  enmendarla.
tema: vivienda
ambito: estatal
efectos:
  - cuando: { arrendador: [si] }
    el_si: perjudica
    justificacion: >-
      Quien tiene viviendas en alquiler pagaría un impuesto adicional del 4 % al 12 % si compra
      otra teniendo ya dos, y si alquila por estancias de hasta 30 noches en un municipio de 10.000
      habitantes o más tendría que cobrar IVA.
    base: >-
      Art. segundo de la proposición (art. 20.Uno.23.º e') de la Ley del IVA y nueva disposición
      adicional novena: impuesto a la acumulación de bienes inmobiliarios de uso residencial).
justificacion: >-
  Es una propuesta fiscal sobre la vivienda de un grupo parlamentario, con efecto directo en
  quienes tienen varias viviendas o las alquilan.
extracto: >-
  [Artículo segundo.Uno, art. 20.Uno.23.º e') de la Ley del IVA] «e') Los arrendamientos de
  apartamentos o viviendas amueblados cuando concurran cualquiera de las siguientes circunstancias:
  […] Su duración a favor de un mismo arrendatario no supere las 30 noches, y se encuentren situados
  en municipios que tengan población de derecho igual o superior a 10.000 habitantes» [Artículo
  segundo.Dos, disposición adicional novena de la Ley del IVA] «Constituirá el hecho imponible del
  impuesto la compra de bienes inmuebles de uso residencial por parte de personas físicas y personas
  jurídicas que sean titulares de dos bienes inmuebles de uso residencial con anterioridad a la
  compra.» «Tercera vivienda 4% Cuarta vivienda 8% Quinta vivienda 12 % Viviendas siguientes […] 12
  % + 5 % por inmueble adicional» [Artículo primero.Uno, art. 3.3 de la Ley de SOCIMI] «Los bienes
  inmuebles que integren el activo de la sociedad deberán permanecer arrendados durante al menos
  siete años.» [Artículo tercero, nuevo art. 72 bis de la Ley Reguladora de las Haciendas Locales]
  «los ayuntamientos podrán establecer, para los bienes inmuebles urbanos de uso residencial, tipos
  diferenciados, en aquellos municipios ubicados en una zona de mercado residencial tensionado […]
  Tratándose de inmuebles de uso residencial la titularidad de los cuales recaiga en un gran
  tenedor, los ayuntamientos podrán exigir un recargo de hasta el 50 por ciento de la cuota líquida
  del impuesto.»
