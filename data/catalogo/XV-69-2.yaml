votacion: XV-69-2
url: "https://www.congreso.es/es/opendata/votaciones?p_p_id=votaciones&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&targetLegislatura=XV&targetDate=22/10/2024"
texto: https://www.congreso.es/public_oficiales/L15/CONG/BOCG/B/BOCG-15-B-139-1.PDF
iniciativa: "Proposición de ley del Grupo Plurinacional SUMAR"
fecha: 2024-10-22
titulo_oficial: >-
  Proposición de Ley del Grupo Parlamentario Plurinacional SUMAR, relativa a la regulación de las
  cláusulas Redito Ad Libitum en la contratación de préstamos y créditos hipotecarios.
titulo: "Reclamar cláusulas abusivas de amortización de la hipoteca"
resumen: >-
  Obliga a los bancos a abrir un sistema de reclamación para las hipotecas con cláusulas de
  amortización que no permiten calcular las cuotas, tienen errores en sus fórmulas o no explican cómo
  evolucionará la cuota. El cliente podría pedir la nulidad de la cláusula o un sistema de pago más
  favorable, y el banco no podría demandarle por impago mientras tanto. Se admitió a trámite.
que_significa_si: >-
  Votar sí era admitirla a trámite para que el Congreso la debatiera y pudiera aprobarla.
tema: vivienda
ambito: estatal
efectos:
  - cuando: { vivienda: [hipoteca] }
    el_si: favorece
    justificacion: >-
      Quien paga una hipoteca con cláusulas de amortización opacas o con errores de cálculo podría
      reclamar al banco su sustitución por un sistema más favorable o su nulidad, sin que el banco
      pudiera demandarle mientras tanto.
    base: >-
      Arts. 2 (cláusulas afectadas), 3 (procedimiento de sustitución) y 5 (aceptación si no hay
      acuerdo en tres meses) y disposición adicional (suspensión de los procedimientos judiciales).
justificacion: >-
  Es la iniciativa de la XV que da un derecho directo de reclamación a quien paga una hipoteca; viene
  de un grupo parlamentario, no del Gobierno.
extracto: >-
  [Art. 2.a).i] «Cláusulas que influyen en la amortización que no permiten el cálculo de las
  cuotas mensuales, ya sea por errores financieros en las fórmulas o sistemas de amortización, o
  por falta de información relativa a la carga económica y obligaciones financieras del contrato.»
  [Art. 2.b)] «Cláusulas de amortización que no provean al prestatario las informaciones relativas
  a los importes de las cuotas mensuales bajo diferentes escenarios posibles de movilidad de los
  tipos de interés aplicables al contrato.» [Art. 3.1] «Las entidades de crédito deberán implantar
  un sistema de reclamación específico, que tendrá carácter voluntario para el consumidor […]»
  [Art. 3.2] «No se podrá iniciar por parte de la entidad, en ningún caso, un procedimiento civil
  por incumplimiento de las condiciones de pago del contrato en aquellos casos en que el contrato
  entre dentro del ámbito de aplicación de esta ley, siempre y cuando las cuotas satisfechas hasta
  el momento por el cliente sean superiores a los intereses mensuales.» [Art. 3.4] «[…] el
  consumidor podrá elegir la opción más favorable, entre las siguientes. a. La nulidad de la
  cláusula de amortización. b. La aplicación de las condiciones financieras que elija […]» [Art.
  5] «[…] una vez transcurridos tres meses desde la presentación de la reclamación por parte de un
  consumidor sin que se haya llegado a un acuerdo entre las partes, se entenderá aceptado el
  petitum del consumidor […]» [Disposición adicional] «La presentación de una solicitud de
  sustitución de las cláusulas de amortización objeto de esta ley en virtud del artículo tercero,
  supondrá la suspensión automática de los procedimientos judiciales iniciados derivados de ese
  contrato, así como de las medidas interpuestas en virtud de este.»
