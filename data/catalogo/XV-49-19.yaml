votacion: XV-49-19
url: "https://www.congreso.es/es/opendata/votaciones?p_p_id=votaciones&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&targetLegislatura=XV&targetDate=20/06/2024"
texto: https://www.boe.es/eli/es/rdl/2024/05/21/2
iniciativa: "Real decreto-ley del Gobierno"
fecha: 2024-06-20
titulo_oficial: >-
  Real Decreto-ley 2/2024, de 21 de mayo, por el que se adoptan medidas urgentes para la
  simplificación y mejora del nivel asistencial de la protección por desempleo, y para completar
  la transposición de la Directiva (UE) 2019/1158 del Parlamento Europeo y del Consejo, de 20 de
  junio de 2019, relativa a la conciliación de la vida familiar y la vida profesional de los
  progenitores y los cuidadores, y por la que se deroga la Directiva 2010/18/UE del Consejo.
titulo: "Reforma del subsidio por desempleo"
resumen: >-
  Reforma el subsidio de desempleo: sube la cuantía en los primeros meses, lo extiende a menores
  de 45 años sin cargas familiares y a colectivos que no lo tenían, y permite cobrar parte del
  subsidio al empezar a trabajar mediante un complemento de apoyo al empleo.
que_significa_si: >-
  Votar sí era convalidar el decreto ley, es decir, mantenerlo en vigor.
tema: empleo
ambito: estatal
efectos:
  - cuando: { trabajo: [desempleo] }
    el_si: favorece
    justificacion: >-
      Quien está en paro puede cobrar un subsidio más alto los primeros meses, acceder a él en más
      casos y mantener una parte si encuentra trabajo.
    base: >-
      Art. 1, que modifica los arts. 274 a 280 de la Ley General de la Seguridad Social.
justificacion: >-
  Es la reforma de las ayudas a las personas en paro de la XV.
