votacion: XV-49-19
url: "https://www.congreso.es/es/opendata/votaciones?p_p_id=votaciones&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&targetLegislatura=XV&targetDate=20/06/2024"
texto: https://www.boe.es/eli/es/rdl/2024/05/21/2
iniciativa: "Real decreto-ley del Gobierno"
fecha: 2024-06-20
titulo_oficial: >-
  Real Decreto-ley 2/2024, de 21 de mayo, por el que se adoptan medidas urgentes para la
  simplificación y mejora del nivel asistencial de la protección por desempleo, y para completar
  la transposición de la Directiva (UE) 2019/1158 del Parlamento Europeo y del Consejo, de 20 de
  junio de 2019, relativa a la conciliación de la vida familiar y la vida profesional de los
  progenitores y los cuidadores, y por la que se deroga la Directiva 2010/18/UE del Consejo.
titulo: "Reforma del subsidio por desempleo"
resumen: >-
  Reforma el subsidio de desempleo: sube la cuantía en los primeros meses, lo extiende a menores
  de 45 años sin cargas familiares y a colectivos que no lo tenían, y permite cobrar parte del
  subsidio al empezar a trabajar mediante un complemento de apoyo al empleo. También completa la
  transposición de la directiva europea de conciliación, con derechos como acumular el permiso de
  lactancia en jornadas completas.
que_significa_si: >-
  Votar sí era convalidar el decreto ley, es decir, mantenerlo en vigor.
tema: empleo
ambito: estatal
efectos:
  - cuando: { trabajo: [desempleo] }
    el_si: favorece
    justificacion: >-
      Quien está en paro puede cobrar un subsidio más alto los primeros meses, acceder a él en más
      casos y mantener una parte si encuentra trabajo.
    base: >-
      Art. segundo, que modifica los arts. 274 a 282 de la Ley General de la Seguridad Social.
justificacion: >-
  Es la reforma de las ayudas a las personas en paro de la XV.
extracto: >-
  [Artículo primero, Uno (art. 37.4 ET)] «Quien ejerza este derecho, por su voluntad, podrá
  sustituirlo por una reducción de su jornada en media hora con la misma finalidad o acumularlo en
  jornadas completas.» [Artículo segundo (art. 274.1.a LGSS)] «Haber agotado la prestación por
  desempleo. En caso de ser menor de cuarenta y cinco años sin responsabilidades familiares se
  exigirá, además, que la prestación por desempleo agotada haya tenido una duración igual o
  superior a trescientos sesenta días.» [Artículo segundo (art. 274.1.b LGSS)] «Encontrarse en
  situación legal de desempleo sin tener cubierto el periodo mínimo de cotización para tener
  derecho a la prestación contributiva, siempre que hayan cotizado al menos noventa días.»
  [Preámbulo] «Se amplía la cobertura del nivel asistencial en algunos tramos de edad
  anteriormente excluidos, al permitir el acceso, por un lado, a los menores de cuarenta y cinco
  años sin responsabilidades familiares siempre que hayan agotado una prestación contributiva de
  360 días, y por otro, a quienes acrediten periodos cotizados inferiores a seis meses, aunque
  carezcan de responsabilidades familiares. Se reconoce el derecho a acceder al subsidio
  asistencial a las personas trabajadoras eventuales agrarias, anteriormente excluidas.» [Artículo
  segundo (art. 278 LGSS)] «La cuantía del subsidio será igual a los siguientes porcentajes del
  indicador público de rentas de efectos múltiples mensual vigente en cada momento: el 95 por
  ciento durante los ciento ochenta primeros días, el 90 por ciento desde el día ciento ochenta y
  uno al día trescientos sesenta, y el 80 por ciento a partir del día trescientos sesenta y uno.»
  [Artículo segundo (art. 282.3 LGSS)] «Para quienes accedan al subsidio por desempleo manteniendo
  uno o varios contratos a tiempo parcial así como para quienes siendo beneficiarios del mismo
  inicien una relación laboral a tiempo completo o parcial, el subsidio se compatibilizará como
  complemento de apoyo al empleo conforme a lo previsto en este artículo.»
