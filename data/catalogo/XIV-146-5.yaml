votacion: XIV-146-5
url: "https://www.congreso.es/es/opendata/votaciones?p_p_id=votaciones&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&targetLegislatura=XIV&targetDate=25/01/2022"
texto: https://www.boe.es/eli/es/rdl/2021/12/21/29
iniciativa: "Real decreto-ley del Gobierno"
fecha: 2022-01-25
titulo_oficial: >-
  Real Decreto-ley 29/2021, de 21 de diciembre, por el que se adoptan medidas urgentes en el
  ámbito energético para el fomento de la movilidad eléctrica, el autoconsumo y el despliegue de
  energías renovables.
titulo: "Rebaja de la factura de la luz (diciembre de 2021)"
resumen: >-
  Prorroga la rebaja del IVA y del impuesto eléctrico en la factura de la luz y los descuentos
  reforzados del bono social eléctrico para los consumidores vulnerables.
que_significa_si: >-
  Votar sí era convalidar el decreto ley, es decir, mantenerlo en vigor.
tema: energia
ambito: estatal
efectos:
  - cuando: { ingresos: [hasta-16k] }
    el_si: favorece
    justificacion: >-
      Quien tiene ingresos bajos y el bono social mantuvo descuentos reforzados en la luz, y todos
      los hogares pagaban menos impuestos en la factura.
    base: >-
      Arts. 1 a 4 del Real Decreto-ley 29/2021 (bono social y fiscalidad de la electricidad).
justificacion: >-
  Es una de las rebajas de la factura de la luz de la crisis energética, con efecto directo en los
  hogares vulnerables.
