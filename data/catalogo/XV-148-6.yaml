votacion: XV-148-6
url: "https://www.congreso.es/es/opendata/votaciones?p_p_id=votaciones&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&targetLegislatura=XV&targetDate=19/11/2025"
texto: https://www.boe.es/eli/es/rdl/2025/10/21/11
iniciativa: "Real decreto-ley del Gobierno"
fecha: 2025-11-19
titulo_oficial: >-
  Real Decreto-ley 11/2025, de 21 de octubre, por el que se establecen medidas para el
  fortalecimiento del Sistema para la Autonomía y Atención a la Dependencia y cumplir con las
  obligaciones establecidas en la Ley 3/2024, de 30 de octubre, para mejorar la calidad de vida de
  las personas con Esclerosis Lateral Amiotrófica y otras enfermedades o procesos de alta
  complejidad y curso irreversible.
titulo: "Refuerzo de la dependencia (2025)"
resumen: >-
  Aporta 379 millones adicionales al sistema de dependencia en 2025 y regula el grado III+ de la ley
  ELA, para el que fija un nivel mínimo de financiación estatal de 4.930 euros al mes por persona.
que_significa_si: >-
  Votar sí era convalidar el decreto ley, es decir, mantenerlo en vigor.
tema: cuidados
ambito: estatal
efectos:
  - cuando: { cuidados: [si] }
    el_si: favorece
    justificacion: >-
      Quien cuida de una persona dependiente se beneficia de más financiación para sus
      prestaciones y servicios.
    base: >-
      Art. 1, que modifica la Ley 39/2006 y añade su disposición adicional decimoséptima, y
      disposición adicional primera (financiación).
justificacion: >-
  Es la medida de financiación de la dependencia de la XV.
