votacion: XIV-200-1
url: "https://www.congreso.es/es/opendata/votaciones?p_p_id=votaciones&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&targetLegislatura=XIV&targetDate=20/09/2022"
texto: https://www.congreso.es/public_oficiales/L14/CONG/BOCG/B/BOCG-14-B-148-1.PDF
iniciativa: "Proposición de ley del Grupo Popular"
fecha: 2022-09-20
titulo_oficial: >-
  Proposición de Ley del Grupo Parlamentario Popular en el Congreso, por la que se modifica la Ley
  24/2013, de 26 de diciembre, del sector eléctrico para incluir medidas para facilitar el
  suministro eléctrico en condiciones competitivas a los consumidores estacionales.
titulo: "Tarifa de la luz para regantes"
resumen: >-
  Proponía que los regantes y otras actividades estacionales pudieran contratar dos potencias
  distintas a lo largo del año sin coste adicional y tuvieran un calendario propio de horas punta
  y valle, fuera de la tarifa general de seis periodos. El Congreso no la admitió a trámite.
que_significa_si: >-
  Votar sí era tomarla en consideración, es decir, admitirla a trámite para debatirla y
  enmendarla.
tema: campo
ambito: estatal
efectos:
  - cuando: { campo: [si] }
    el_si: favorece
    justificacion: >-
      Quien vive del campo y riega podría contratar dos potencias según la temporada sin pagar más
      y tendría más horas de luz a precio barato.
    base: >-
      Art. 1 (nuevo art. 4.7 del Real Decreto 1164/2001) y art. 2 (nuevo art. 16.8 de la Ley
      24/2013) de la proposición.
justificacion: >-
  Es una propuesta de la oposición sobre el coste de la electricidad para el regadío, con efecto
  directo en agricultores.
