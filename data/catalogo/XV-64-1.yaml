votacion: XV-64-1
url: "https://www.congreso.es/es/opendata/votaciones?p_p_id=votaciones&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&targetLegislatura=XV&targetDate=08/10/2024"
texto: https://www.congreso.es/public_oficiales/L15/CONG/BOCG/B/BOCG-15-B-8-1.PDF
iniciativa: "Proposición de ley de iniciativa legislativa popular"
fecha: 2024-10-08
titulo_oficial: >-
  Proposición de Ley de modificación de la Ley 39/2006, de 14 de diciembre, de Promoción de la
  Autonomía Personal y Atención a las personas en situación de dependencia, en materia de
  participación en el coste de las prestaciones y servicios de las personas beneficiarias
  (corresponde a los números de expediente 120/000031/0000 de la X Legislatura, 120/000001/0000 de
  la XI Legislatura, 120/000001/0000 de la XII Legislatura, 120/000001/0000 de la XIII Legislatura
  y 120/000001/0000 de la XIV Legislatura).
titulo: "Límite al copago de la dependencia"
resumen: >-
  Iniciativa legislativa popular que limita lo que pagan las personas dependientes por sus
  servicios: exentas si su capacidad económica no supera 2,5 veces el IPREM, nunca más del 60 % del
  precio del servicio y con un mínimo garantizado para gastos personales. Se admitió a trámite.
que_significa_si: >-
  Votar sí era admitirla a trámite para que el Congreso la debatiera y pudiera aprobarla.
tema: cuidados
ambito: estatal
efectos:
  - cuando: { cuidados: [si] }
    el_si: favorece
    justificacion: >-
      La persona dependiente a la que cuida pagaría menos por sus servicios, o nada si tiene pocos
      ingresos.
    base: >-
      Artículo único, apartado dos, de la proposición (nuevo art. 33.3 de la Ley 39/2006).
justificacion: >-
  Es una iniciativa ciudadana avalada por firmas sobre el coste de la dependencia en la XV; afecta
  directamente a los hogares que cuidan de una persona dependiente.
