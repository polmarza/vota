texto: https://www.boe.es/eli/es/rdl/2022/06/25/11
iniciativa: "Real decreto-ley del Gobierno"
fecha: 2022-07-14
titulo_oficial: >-
  Real Decreto-ley 11/2022, de 25 de junio, por el que se adoptan y se prorrogan determinadas
  medidas para responder a las consecuencias económicas y sociales de la guerra en Ucrania, para
  hacer frente a situaciones de vulnerabilidad social y económica, y para la recuperación
  económica y social de la isla de La Palma.
titulo: "Prórroga de las medidas contra la subida de precios (junio de 2022)"
resumen: >-
  Prorroga hasta el 31 de diciembre de 2022 la bonificación de 20 céntimos por litro de combustible,
  los descuentos reforzados del bono social eléctrico, la prohibición de cortar la luz, el gas y el
  agua a los consumidores vulnerables y la suspensión de desahucios de hogares vulnerables sin
  alternativa habitacional. Baja el IVA de la luz al 5 % en los contratos de hasta 10 kW; limita la
  subida anual del alquiler al índice de garantía de competitividad si el casero es un gran tenedor
  (y, si no lo es, cuando no haya otro pacto); sube un 15 % el ingreso mínimo vital y las pensiones
  no contributivas de jubilación e invalidez; financia de septiembre a diciembre una rebaja del 30 %
  en los abonos de transporte urbano e interurbano y del 50 % en los de tren de servicio público, y
  crea un pago único de 200 euros para quien trabaja o está en paro si su hogar ingresó menos de
  14.000 euros en 2021 y tiene menos de 43.196,40 euros de patrimonio, salvo que cobre el ingreso
  mínimo vital o una pensión. Incluye también medidas para La Palma. El Congreso lo convalidó.
que_significa_si: >-
  Votar sí era convalidar el decreto ley, es decir, mantenerlo en vigor.
tema: energia
ambito: estatal
efectos:
  - cuando: { transporte: [coche] }
    el_si: favorece
    justificacion: >-
      Quien usa el coche siguió pagando 20 céntimos menos por litro de gasolina o gasóleo hasta el
      31 de diciembre de 2022.
    base: >-
      Art. 1, apartado Tres, del Real Decreto-ley 11/2022 (nueva redacción del art. 15.2 y 15.3
      del Real Decreto-ley 6/2022: bonificación del combustible hasta el 31-12-2022).
justificacion: >-
  Es la prórroga de verano de 2022 de las medidas contra la subida de precios, con efecto directo
  en quien usa el coche.
extracto: >-
  siempre que los adquieran, entre los días 1 de abril y 31 de diciembre de 2022, ambos incluidos, a
  los colaboradores en la gestión de esta bonificación. […] Se prorrogan hasta el 31 de diciembre de
  2022 los descuentos del bono social aplicables a los consumidores domésticos de energía eléctrica
  […] Hasta el 31 de diciembre de 2022 inclusive, no podrá suspenderse el suministro de energía
  eléctrica, gas natural y agua a aquellos consumidores en los que concurra la condición de
  consumidor vulnerable […] Con efectos desde el 1 de julio de 2022 y vigencia hasta el 31 de
  diciembre de 2022, se aplicará el tipo del 5 por ciento del Impuesto sobre el Valor Añadido […]
  En el caso de que el arrendador sea un gran tenedor, el incremento de la renta será el que
  resulte del nuevo pacto entre las partes, sin que pueda exceder del resultado de aplicar la
  variación anual del Índice de Garantía de Competitividad […] tendrán un incremento extraordinario
  del 15 por ciento sobre el importe que corresponda percibir a cada beneficiario en esos meses. […]
  Serán beneficiarios de una ayuda, en pago único, de 200 euros de cuantía, las personas físicas que
  en la fecha de entrada de vigor del presente real decreto-ley realicen una actividad por cuenta
  propia o ajena por la cual estén dados de alta en el régimen correspondiente de la Seguridad
  Social o mutualidad, o sean desempleados inscritos en la oficina de empleo, sean beneficiarios o
  no de la prestación o subsidio por desempleo, siempre que en 2021 hubieran percibido ingresos
  inferiores a 14.000 euros anuales, y tuvieran un patrimonio inferior a 43.196,40 euros anuales.
  El cómputo de ingresos y de patrimonio se efectuará de manera conjunta […] no tendrán derecho a la
  ayuda quienes, a la fecha de entrada en vigor del presente real decreto-ley, perciban el ingreso
  mínimo vital, o pensiones abonadas por el Régimen General y los Regímenes especiales de la
  Seguridad Social
