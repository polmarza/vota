votacion: XIV-195-180
url: "https://www.congreso.es/es/opendata/votaciones?p_p_id=votaciones&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&targetLegislatura=XIV&targetDate=14/07/2022"
texto: https://www.boe.es/eli/es/rdl/2022/06/25/11
iniciativa: "Real decreto-ley del Gobierno"
fecha: 2022-07-14
titulo_oficial: >-
  Real Decreto-ley 11/2022, de 25 de junio, por el que se adoptan y se prorrogan determinadas
  medidas para responder a las consecuencias económicas y sociales de la guerra en Ucrania, para
  hacer frente a situaciones de vulnerabilidad social y económica, y para la recuperación
  económica y social de la isla de La Palma.
titulo: "Prórroga de las medidas contra la subida de precios (junio de 2022)"
resumen: >-
  Prorroga hasta final de 2022 la bonificación de 20 céntimos por litro de combustible y los
  descuentos reforzados del bono social eléctrico, baja el IVA de la luz al 5 % y crea un pago
  único de 200 euros para trabajadores y parados con ingresos por debajo de 14.000 euros. El
  Congreso lo convalidó.
que_significa_si: >-
  Votar sí era convalidar el decreto ley, es decir, mantenerlo en vigor.
tema: energia
ambito: estatal
efectos:
  - cuando: { transporte: [coche] }
    el_si: favorece
    justificacion: >-
      Quien usa el coche siguió pagando 20 céntimos menos por litro de gasolina o gasóleo hasta el
      31 de diciembre de 2022.
    base: >-
      Art. 1, apartado Tres, del Real Decreto-ley 11/2022 (nueva redacción del art. 15.2 y 15.3
      del Real Decreto-ley 6/2022: bonificación del combustible hasta el 31-12-2022).
  - cuando: { ingresos: [hasta-16k] }
    el_si: favorece
    justificacion: >-
      Quien tiene ingresos bajos podía cobrar un pago único de 200 euros si trabajaba o estaba en
      paro y sus ingresos no llegaban a 14.000 euros, y si tenía el bono social mantenía sus
      descuentos reforzados en la luz.
    base: >-
      Art. 31 del Real Decreto-ley 11/2022 (ayuda de 200 euros) y art. 1, apartado Quince
      (descuentos del bono social eléctrico hasta el 31-12-2022).
justificacion: >-
  Es la prórroga de verano de 2022 de las medidas contra la subida de precios, con efecto directo
  en conductores y hogares con ingresos bajos.
