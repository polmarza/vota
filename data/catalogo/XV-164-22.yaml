votacion: XV-164-22
url: "https://www.congreso.es/es/opendata/votaciones?p_p_id=votaciones&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&targetLegislatura=XV&targetDate=26/02/2026"
texto: https://www.boe.es/eli/es/rdl/2026/02/03/2
iniciativa: "Real decreto-ley del Gobierno"
fecha: 2026-02-26
titulo_oficial: >-
  Real Decreto-ley 2/2026, de 3 de febrero, por el que se adoptan medidas urgentes para hacer
  frente a situaciones de vulnerabilidad social, en materia tributaria y relativas a los recursos
  de los sistemas de financiación territorial.
titulo: "Bono social, desahucios y módulos de autónomos (2026)"
resumen: >-
  Fija para 2026 los descuentos del bono social eléctrico (42,5 % y 57,5 %), mantiene la
  prohibición de cortar la luz, el gas y el agua a los hogares vulnerables, alarga la suspensión
  de desahucios de inquilinos vulnerables hasta final de 2026 y prorroga los límites que permiten
  a los autónomos seguir tributando por módulos. El Congreso no lo convalidó y quedó derogado.
que_significa_si: >-
  Votar sí era convalidar el decreto ley, es decir, mantenerlo en vigor.
tema: fiscalidad
ambito: estatal
efectos:
  - cuando: { vivienda: [alquiler], ingresos: [hasta-16k] }
    el_si: favorece
    justificacion: >-
      Quien vive de alquiler con ingresos bajos podía pedir que se suspendiera su desahucio hasta
      final de 2026 si acreditaba vulnerabilidad económica.
    base: >-
      Art. 1, apartado Uno, del Real Decreto-ley 2/2026 (nueva redacción del art. 1 del Real
      Decreto-ley 11/2020: suspensión de desahucios hasta el 31-12-2026).
  - cuando: { arrendador: [si] }
    el_si: perjudica
    justificacion: >-
      Quien alquila una vivienda podía ver suspendido hasta el 31-12-2026 el desahucio de un inquilino
      vulnerable que no paga, aunque con derecho a pedir una compensación pública.
    base: >-
      Art. 1, apartado Uno, del Real Decreto-ley 2/2026 (nueva redacción del art. 1 del Real
      Decreto-ley 11/2020: suspensión de desahucios hasta el 31-12-2026).
  - cuando: { trabajo: [autonomo] }
    el_si: favorece
    justificacion: >-
      El autónomo que tributa por módulos podía seguir en ese régimen en 2026 con los límites de
      facturación ampliados (250.000 euros en lugar de 150.000).
    base: >-
      Art. 10, apartado Cuatro, del Real Decreto-ley 2/2026 (disposición transitoria trigésima
      segunda de la Ley del IRPF) y art. 8, apartado Uno (disposición transitoria decimotercera de
      la Ley del IVA).
justificacion: >-
  Es la votación sobre la protección de 2026 de los consumidores vulnerables de energía y de los
  inquilinos vulnerables, con efecto directo en inquilinos con ingresos bajos, arrendadores y
  autónomos en módulos.
extracto: >-
  [Art. 1, apartado Uno (art. 1.1 del Real Decreto-ley 11/2020)] «Desde la entrada en vigor del
  presente real decreto-ley y hasta el 31 de diciembre de 2026, en todos los juicios verbales que
  versen sobre reclamaciones de renta o cantidades debidas por el arrendatario […] la persona
  arrendataria podrá instar, de conformidad con lo previsto en este artículo, un incidente de
  suspensión extraordinaria del desahucio o lanzamiento ante el Juzgado por encontrarse en una
  situación de vulnerabilidad económica que le imposibilite encontrar una alternativa habitacional»
  [Art. 2 (disposición adicional segunda.2 del Real Decreto-ley 37/2020)] «La compensación
  consistirá en el valor medio que correspondería a un alquiler de vivienda en el entorno en que se
  encuentre el inmueble […] por el período que medie entre que se acordare la suspensión y el
  momento en el que la misma se levante por el Tribunal o hasta el 31 de diciembre de 2026» [Art.
  5.1] «El descuento correspondiente al consumidor vulnerable será del 42,5 por ciento. En el caso
  del consumidor vulnerable severo, el descuento será del 57,5 por ciento.» [Art. 6 (art. 83 del
  Real Decreto-ley 1/2025)] «La garantía de suministro de agua y energía a consumidores vulnerables
  establecida en el artículo 4 del Real Decreto-ley 8/2021 […] se aplicará desde 1 de enero de 2025
  hasta el 31 de diciembre de 2026.» [Art. 8, apartado Uno (disposición transitoria decimotercera de
  la Ley del IVA)] «Para los ejercicios 2016 a 2026, ambos inclusive, la magnitud de 150.000 euros a
  que se refiere el primer guion del número 2.º y el número 3.º del apartado dos del artículo 122, y
  el número 6.º del apartado dos del artículo 124 de esta ley, queda fijada en 250.000 euros.» [Art.
  10, apartado Cuatro (disposición transitoria trigésima segunda de la Ley del IRPF)] «Límites para
  la aplicación del método de estimación objetiva en los ejercicios 2016 a 2026. […] Para los
  ejercicios 2016 a 2026, ambos inclusive, las magnitudes de 150.000 y 75.000 euros a que se refiere
  el apartado a’) de la letra b) de la norma 3.ª del apartado 1 del artículo 31 de esta Ley, quedan
  fijadas en 250.000 y 125.000 euros, respectivamente.»
