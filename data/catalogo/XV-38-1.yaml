votacion: XV-38-1
url: "https://www.congreso.es/es/opendata/votaciones?p_p_id=votaciones&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&targetLegislatura=XV&targetDate=21/05/2024"
texto: https://www.congreso.es/public_oficiales/L15/CONG/BOCG/B/BOCG-15-B-75-1.PDF
iniciativa: "Proposición de ley del Grupo Republicano"
fecha: 2024-05-21
titulo_oficial: >-
  Proposición de Ley del Grupo Parlamentario Republicano, por la que se modifica la Ley 12/2013,
  de 2 de agosto, de medidas para mejorar el funcionamiento de la cadena alimentaria.
titulo: "Venta a pérdidas en la cadena alimentaria"
resumen: >-
  Reforma de la ley de la cadena alimentaria para hacer efectiva la prohibición de vender por
  debajo del coste de producción, extenderla a las reventas y que el Ministerio publique
  indicadores de costes. Se admitió a trámite.
que_significa_si: >-
  Votar sí era admitirla a trámite para que el Congreso la debatiera y pudiera aprobarla.
tema: campo
ambito: estatal
efectos:
  - cuando: { campo: [si] }
    el_si: favorece
    justificacion: >-
      Quien vive del campo tendría más garantías de que no le compren por debajo de lo que le
      cuesta producir.
    base: >-
      Artículo único de la proposición, que modifica los arts. 9 y 12 ter de la Ley 12/2013 de la
      cadena alimentaria.
justificacion: >-
  Es una propuesta de un grupo distinto del Gobierno sobre la renta de agricultores y ganaderos en
  la XV.
extracto: >-
  [Artículo único, Dos (art. 9.1.c)] «El precio del contrato alimentario que tenga que percibir un
  productor primario o una agrupación de estos deberá ser, en todo caso, superior al total de
  costes asumidos por el productor o la cooperativa u otra entidad asociativa o coste efectivo de
  producción […]» [Artículo único, Cuatro (art. 12 ter.1)] «Con el fin de evitar la destrucción
  del valor en la cadena alimentaria, cada operador de la misma deberá pagar al operador
  inmediatamente anterior un precio igual o superior al coste de producción de tal producto en que
  efectivamente haya incurrido o asumido dicho operador.» [Artículo único, Cinco (art. 12
  quater.1)] «En las actividades de comercio o la transformación de productos agrarios y
  alimentarios, no se podrán ofrecer ni realizar reventas con pérdida.» [Artículo único, Ocho
  (disposición adicional novena)] «Con el fin de disponer de mecanismos oficiales de captación de
  costos indicativos, a los efectos de lo establecido en las letras c) y j) del apartado 1 del
  artículo 9 y de los artículos 12 ter y 12 quarter, así como precios indicativos […] b) La
  elaboración de los datos estadísticos previstos en la letra a) anterior corresponde al
  ministerio competente en materia de agricultura, ganadería y alimentación.»
