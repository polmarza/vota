votacion: XIV-205-23
url: "https://www.congreso.es/es/opendata/votaciones?p_p_id=votaciones&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&targetLegislatura=XIV&targetDate=29/09/2022"
texto: https://www.boe.es/eli/es/rdl/2022/09/06/16
iniciativa: "Real decreto-ley del Gobierno"
fecha: 2022-09-29
titulo_oficial: >-
  Real Decreto-ley 16/2022, de 6 de septiembre, para la mejora de las condiciones de trabajo y de
  Seguridad Social de las personas trabajadoras al servicio del hogar.
titulo: "Paro y despido de las empleadas de hogar"
resumen: >-
  Incluye a las personas que trabajan al servicio del hogar en la protección por desempleo y en el
  Fondo de Garantía Salarial: desde el 1 de octubre de 2022 se cotiza por desempleo un 6,05 % (el
  5 % a cargo de quien emplea y el 1,05 % de la persona empleada) y quien emplea aporta además un
  0,2 % al Fondo, con una bonificación del 80 % en su parte de esas dos cotizaciones. Mantiene la
  reducción del 20 % en la cotización por contingencias comunes, que puede cambiarse por una
  bonificación del 45 % o del 30 % según el patrimonio o la renta. Suprime el desistimiento, que
  permitía despedir sin alegar causa: el contrato solo puede extinguirse por las causas del
  Estatuto de los Trabajadores o por otras justificadas propias del hogar (menos ingresos o más
  gastos de la familia, cambio de sus necesidades, un comportamiento que justifique la pérdida de
  confianza); en estas últimas, por escrito, con preaviso y una indemnización de 12 días de salario
  por año trabajado, con un máximo de seis mensualidades. Desde 2023, quien emplea asume también la
  afiliación y la cotización cuando la persona trabaja menos de 60 horas al mes.
que_significa_si: >-
  Votar sí era convalidar el decreto ley, es decir, mantenerlo en vigor.
tema: empleo
ambito: estatal
efectos:
  - cuando: { contrata: [hogar] }
    el_si: perjudica
    justificacion: >-
      Quien tiene contratada a una persona en casa tiene que cotizar por ella por desempleo y al
      Fondo de Garantía Salarial, aunque con una bonificación del 80 % en esa aportación, y ya no
      puede despedirla sin alegar causa: necesita una causa justificada, comunicarlo por escrito,
      pagar una indemnización y dar preaviso.
    base: >-
      Art. 5.Tres, que da nueva redacción al art. 11 del Real Decreto 1620/2011 (extinción del
      contrato); art. 4 (cotización al Fondo de Garantía Salarial); disposición adicional primera
      y disposición transitoria segunda (cotización por desempleo y bonificaciones).
justificacion: >-
  Es la norma que dio a las empleadas de hogar el derecho al paro y suprimió el despido sin causa
  en ese trabajo, uno de los efectos directos que faltaban en el catálogo.
extracto: >-
  [Disposición transitoria segunda] «1. La cotización por la contingencia de desempleo y al Fondo de
  Garantía Salarial respecto a los trabajadores incluidos en el Sistema Especial para Empleados de
  Hogar, establecido en el Régimen General de la Seguridad Social, será obligatoria a partir del 1
  de octubre de 2022.» «a) El tipo de cotización por desempleo será del 6,05 del que el 5 por
  ciento será a cargo del empleador y el 1,05 por ciento a cargo del empleado. b) El tipo de
  cotización al Fondo de Garantía Salarial será de 0,2 a cargo exclusivo del empleador.»
  [Disposición adicional primera] «1. Las personas que tengan contratada o contraten bajo cualquier
  modalidad contractual a una persona trabajadora al servicio del hogar y le den de alta en el
  Régimen General de la Seguridad Social, tendrán derecho a una reducción del 20 por ciento en la
  aportación empresarial a la cotización a la Seguridad Social por contingencias comunes
  correspondiente al Sistema Especial para Empleados de Hogar establecido en dicho régimen.
  Asimismo, tendrán derecho a una bonificación del 80 por ciento en las aportaciones empresariales
  a la cotización por desempleo y al Fondo de Garantía Salarial en ese Sistema Especial.» «tendrán
  derecho, durante toda la situación de alta en dicho régimen, a una bonificación del 45 por ciento
  o del 30 por ciento en la aportación empresarial a la cotización a la Seguridad Social por
  contingencias comunes» «cuando cumplan los requisitos de patrimonio y/o renta de la unidad
  familiar o de convivencia de la persona empleadora» [Art. 5.Tres, art. 11 del Real Decreto
  1620/2011] «1. La relación laboral de carácter especial del servicio del hogar familiar podrá
  extinguirse por las causas establecidas en el artículo 49.1 del Estatuto de los Trabajadores»
  «2. Sin perjuicio de lo anterior, esta relación laboral de carácter especial podrá extinguirse
  por alguna de las siguientes causas, siempre que estén justificadas: a) Disminución de los
  ingresos de la unidad familiar o incremento de sus gastos por circunstancia sobrevenida. b)
  Modificación sustancial de las necesidades de la unidad familiar que justifican que se prescinda
  de la persona trabajadora del hogar.» «Simultáneamente a la comunicación de la extinción, la
  persona empleadora deberá poner a disposición de la persona trabajadora una indemnización, en
  cuantía equivalente al salario correspondiente a doce días por año de servicio con el límite de
  seis mensualidades.» [Disposición adicional segunda] «A partir del día 1 de enero de 2023, las
  personas empleadoras asumirán las obligaciones en materia de cotización con relación a las
  personas trabajadoras al servicio del hogar que presten sus servicios durante menos de 60 horas
  mensuales por persona empleadora»
