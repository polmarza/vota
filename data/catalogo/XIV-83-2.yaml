votacion: XIV-83-2
url: "https://www.congreso.es/es/opendata/votaciones?p_p_id=votaciones&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&targetLegislatura=XIV&targetDate=16/03/2021"
texto: https://www.congreso.es/public_oficiales/L14/CONG/BOCG/B/BOCG-14-B-53-1.PDF
iniciativa: "Proposición de ley del Grupo Ciudadanos"
fecha: 2021-03-16
titulo_oficial: >-
  Proposición de Ley del Grupo Parlamentario Ciudadanos, Integral de Protección y Apoyo a las
  Familias.
titulo: "Ley de familias de Ciudadanos"
resumen: >-
  Consideraba familia numerosa a toda familia con dos o más hijos (de categoría especial con tres),
  extendía sus beneficios a las familias monoparentales, alargaba a 18 semanas el permiso por
  nacimiento de cada progenitor (36 en las familias monoparentales), creaba una bolsa de horas de al
  menos el 5 % de la jornada anual para conciliar y ampliaba la reducción de jornada por cuidado a
  quien tiene la guarda legal de una persona mayor que requiera especial dedicación y a familiares
  de grado más lejano que convivan con quien los cuida. No se admitió a trámite.
que_significa_si: >-
  Votar sí era admitirla a trámite para que el Congreso la debatiera y pudiera aprobarla.
tema: familia
ambito: estatal
efectos:
  - cuando: { hijos: [pequenos, menores] }
    el_si: favorece
    justificacion: >-
      Una familia con dos hijos pasaría a ser numerosa, con sus descuentos y ventajas, y los
      permisos por nacimiento serían más largos.
    base: >-
      Arts. 1 y 16 de la proposición (Ley 40/2003 de familias numerosas y art. 48 del Estatuto de
      los Trabajadores).
justificacion: >-
  Es la propuesta sobre familia de la oposición en la XIV.
extracto: >-
  [Art. 1 (art. 2.1 Ley 40/2003)] «se entiende por familia numerosa la integrada por uno o dos
  ascendientes con dos o más hijos, sean o no comunes.» [Art. 2 (art. 4.1 Ley 40/2003)] «Especial:
  las de tres o más hijos» [Art. 3 (art. 2.6 Ley 40/2003)] «Los beneficios reconocidos en esta Ley a
  las familias numerosas se extenderán a las familias monoparentales» [Art. 16 (art. 48.4 ET)] «El
  nacimiento suspenderá el contrato de trabajo del progenitor distinto de la madre biológica durante
  18 semanas» [Art. 5 (art. 47.10 ET)] «En el supuesto de familia monoparental, la suspensión del
  contrato de trabajo […] tendrá una duración de 36 semanas» [Art. 12 (art. 37.5 ET)] «Las personas
  trabajadoras dispondrán de una bolsa de horas de, al menos, un 5 por ciento de su jornada de
  trabajo anual para hacer efectivo el derecho a la conciliación de la vida personal, familiar y
  laboral.» [Art. 13 (art. 37.6 ET)] «Quien por razones de guarda legal tenga a su cuidado directo
  algún menor de doce años, o una persona mayor que requiera especial dedicación o una persona con
  discapacidad que no pueda valerse por sí misma y que no desempeñe una actividad retribuida, tendrá
  derecho a una reducción de la jornada de trabajo» «Tendrá el mismo derecho quien precise
  encargarse del cuidado directo de un familiar hasta el segundo grado de consanguinidad o afinidad,
  o aún de grado más lejano si mediara convivencia con el trabajador» [Exposición de motivos] «se
  amplía el derecho a la reducción de jornada por cuidado de hijos o familiares previsto en el
  artículo 37.6 del Estatuto de los Trabajadores, extendiendo su aplicación a quienes por razones de
  guarda legal tengan a su cuidado directo a una persona mayor que requiera especial dedicación»
