votacion: XV-99-1
url: "https://www.congreso.es/es/opendata/votaciones?p_p_id=votaciones&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&targetLegislatura=XV&targetDate=18/03/2025"
texto: https://www.congreso.es/public_oficiales/L15/CONG/BOCG/B/BOCG-15-B-173-1.PDF
iniciativa: "Proposición de ley del Grupo Junts per Catalunya"
fecha: 2025-03-18
titulo_oficial: >-
  Proposición de Ley del Grupo Parlamentario Junts per Catalunya, de medidas urgentes para hacer
  frente a la ocupación ilegal de inmuebles (Orgánica).
titulo: "Ley contra la ocupación de Junts"
resumen: >-
  Obliga al juez, a petición del propietario, a acordar como medida cautelar el desalojo de una
  vivienda ocupada si los ocupantes no acreditan en 48 horas un título, permite a la policía desalojar
  en caso de delito flagrante y lleva estos casos al juicio rápido. También deja fuera de la
  suspensión de desalojos de ocupantes vulnerables las demandas civiles para recuperar una vivienda
  ocupada (art. 250.1.4.º de la Ley de Enjuiciamiento Civil). Se admitió a trámite.
que_significa_si: >-
  Votar sí era admitirla a trámite para que el Congreso la debatiera y pudiera aprobarla.
tema: vivienda
ambito: estatal
efectos:
  - cuando: { vivienda: [propiedad, hipoteca] }
    el_si: favorece
    justificacion: >-
      Quien tiene una vivienda en propiedad podría recuperarla en 48 horas, como medida cautelar, si se
      la ocuparan sin título.
    base: >-
      Art. uno, tres (nuevo art. 544 sexies de la Ley de Enjuiciamiento Criminal) y art. uno, dos (art.
      282 LECrim).
  - cuando: { arrendador: [si] }
    el_si: favorece
    justificacion: >-
      Quien tiene viviendas que alquila podría recuperarlas en 48 horas si se las ocuparan, y la
      vulnerabilidad de los ocupantes dejaría de poder suspender la demanda civil para recuperarlas.
    base: >-
      Art. uno, tres (art. 544 sexies LECrim) y art. dos (art. 1 bis.1 del Real Decreto-ley 11/2020).
justificacion: >-
  Es la propuesta contra la ocupación de la XV que se admitió a trámite, de un grupo distinto de los
  que la habían planteado en la XIV.
extracto: >-
  [Art. uno.Tres (nuevo art. 544 sexies LECrim)] «Cuando se presente una denuncia por delito de
  allanamiento de morada o delito leve de usurpación de bien inmueble de los artículos 202 y 245.2
  del Código Penal, el órgano judicial adoptará, previa solicitud de parte, la medida cautelar de
  expulsión del inmueble» «El ocupante o los ocupantes que se puedan localizar tendrán un plazo de
  48 horas para acreditar su posesión legítima. Si el ocupante u ocupantes que se hayan localizado
  no aportasen título de posesión legítima, se procederá, con el auxilio policial que sea necesario,
  al desalojo inmediato del bien inmueble y la entrega de la posesión al titular legítimo.» [Art.
  uno.Dos (art. 282 LECrim)] «cuando se trate de delitos flagrantes y mientras persista la
  ocupación, la policía judicial o la fuerza policial actuante, podrá proceder al inmediato desalojo
  del bien inmueble.» [Exposición de motivos] «modificar el artículo 962 de la LECRIM para permitir
  el enjuiciamiento del delito leve de usurpación de bien inmueble por los trámites del juicio
  inmediato por delito leve.» «eliminar la referencia del apartado 4.º del artículo 250.1 LEC del
  artículo 1 bis del RDL 11/2020 de 31 de marzo.» [Art. dos (art. 1 bis del Real Decreto-ley
  11/2020)] «en todos los juicios verbales en los que se sustancien las demandas a las que se
  refieren los apartados 2.º y 7.º del artículo 250.1 de la Ley 1/2000, de 7 de enero, de
  Enjuiciamiento Civil, el Juez tendrá la facultad de suspender el lanzamiento hasta el 31 de
  diciembre de 2025.» «que se trate de viviendas que pertenezcan a personas jurídicas o a personas
  físicas titulares de más de diez viviendas»
