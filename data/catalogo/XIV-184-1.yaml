votacion: XIV-184-1
url: "https://www.congreso.es/es/opendata/votaciones?p_p_id=votaciones&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&targetLegislatura=XIV&targetDate=07/06/2022"
texto: https://www.congreso.es/public_oficiales/L14/CONG/BOCG/B/BOCG-14-B-235-1.PDF
iniciativa: "Proposición de ley del Grupo Confederal de Unidas Podemos-En Comú Podem-Galicia en Común"
fecha: 2022-06-07
titulo_oficial: >-
  Proposición de Ley del Grupo Parlamentario Confederal de Unidas Podemos-En Comú Podem-Galicia en
  Común, del Impuesto sobre la titularidad, tenencia, disponibilidad, disfrute o uso de bienes o
  derechos por personas con grandes fortunas.
titulo: "Impuesto a las grandes fortunas de Unidas Podemos"
resumen: >-
  Proponía un impuesto estatal anual, complementario del de Patrimonio, sobre las personas con un
  patrimonio total de más de 10 millones de euros, contando también los bienes exentos y lo que
  tuvieran a través de sociedades sin sustancia mínima.
  El tipo, del 3,6 % al 5 % según el
  patrimonio total, se aplicaría sobre el patrimonio neto después de un mínimo exento de un millón,
  y se podría descontar lo pagado por el Impuesto sobre el Patrimonio. De las participaciones en empresas,
  solo quedarían exentas las de pymes. La gestión correspondería al Estado y entraría en vigor el 1 de
  enero de 2023. No se admitió a trámite.
que_significa_si: >-
  Votar sí era admitirla a trámite para que el Congreso la debatiera y pudiera aprobarla.
tema: fiscalidad
ambito: estatal
efectos:
  - cuando:
      patrimonio: [mas-3m]
      ccaa: [andalucia, aragon, asturias, baleares, canarias, cantabria, castilla-la-mancha, castilla-y-leon, cataluna, comunitat-valenciana, extremadura, galicia, madrid, murcia, la-rioja, ceuta, melilla]
    el_si: perjudica
    justificacion: >-
      Quien tiene un patrimonio de más de 10 millones de euros pagaría un impuesto nuevo, del 3,6 %
      al 5 %, después de descontar lo que pague por el Impuesto sobre el Patrimonio; por debajo de
      10 millones no pagaría nada. No se aplica en el País Vasco ni en Navarra, que tienen su propio
      régimen fiscal.
    base: >-
      Artículos 1, 3, 28 y 30 (objeto, hecho imponible, mínimo exento y escala) y artículo 33.Uno
      (deducción de la cuota del Impuesto sobre el Patrimonio) de la proposición.
justificacion: >-
  Es la propuesta de un grupo parlamentario de un impuesto sobre los patrimonios más grandes, con
  umbral y tipos distintos de los del impuesto de solidaridad que se aprobó después.
extracto: >-
  [Artículo 1.Uno] «El Impuesto sobre la titularidad, tenencia, disponibilidad, disfrute o uso de
  bienes o derechos por personas con grandes fortunas es un tributo estatal de carácter directo y
  naturaleza personal que grava la titularidad, tenencia, disponibilidad, disfrute o uso de bienes o
  derechos por personas físicas con grandes fortunas en los términos previstos en esta Ley.»
  [Artículo 2] «se aplicará en todo el territorio español, sin perjuicio de los regímenes
  tributarios torales de Concierto y Convenio Económico vigentes en los Territorios Históricos del
  País Vasco y de la Comunidad Foral de Navarra,» [Artículo 4.Dos] «Únicamente estará exenta la plena
  propiedad, la nuda propiedad y el derecho de usufructo vitalicio sobre las participaciones en
  entidades, con o sin cotización en mercados organizados, que tengan la consideración de pyme,»
  [Artículo 28.Uno] «En el supuesto de obligación personal, la base imponible se reducirá, en
  concepto de mínimo exento en 1.000.000 euros.» [Artículo 30] «Primero. Se calculará el tipo medio,
  redondeado con dos decimales, que resulte de aplicar la siguiente escala al patrimonio total
  definido en el apartado Cinco del artículo 9 de esta ley. Segundo. Se aplicará el tipo medio
  calculado según la regla anterior a la base liquidable del impuesto.» [Escala: hasta 10.000.000
  euros, cuota 0; tipos del 3,6 % al 5,0 % en adelante] [Artículo 33.Uno] «La cuota líquida vendrá
  determinada por la cuota íntegra, en su caso ajustada con los límites del artículo 31, minorada
  con los importes que correspondan del artículo 32 y, en su caso, la deducción de la cuota a
  ingresar autoliquidada por el impuesto sobre el patrimonio del ejercicio fiscal.» [Exposición de
  motivos] «definiendo el valor de la gran fortuna individual a partir de 10 millones de euros
  (entre bienes exentos y no exentos) descontadas las deudas y cargas deducidles,» [Disposición
  final primera] «Las disposiciones contenidas en esta ley entrarán en vigor el día 1 de enero de
  2023.»
