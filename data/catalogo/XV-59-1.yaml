url: "https://www.congreso.es/es/opendata/votaciones?p_p_id=votaciones&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&targetLegislatura=XV&targetDate=17/09/2024"
texto: https://www.congreso.es/public_oficiales/L15/CONG/BOCG/B/BOCG-15-B-134-1.PDF
iniciativa: "Proposición de ley de los grupos Sumar, Euskal Herria Bildu, Republicano y Mixto"
fecha: 2024-09-17
titulo_oficial: >-
  Proposición de Ley del Grupo Parlamentario Plurinacional SUMAR, relativa a la regulación de los
  contratos de alquiler de vivienda por temporada y alquiler de habitaciones.
titulo: "Alquiler de temporada y de habitaciones"
resumen: >-
  Extendía las protecciones del alquiler de vivienda habitual de la Ley de Arrendamientos Urbanos
  a los alquileres de habitaciones y limitaba los contratos de temporada, que se usaban para
  esquivar la duración mínima y la contención de rentas. No se admitió a trámite (una versión
  posterior sí se admitió en diciembre de 2024).
que_significa_si: >-
  Votar sí era admitirla a trámite para que el Congreso la debatiera y pudiera aprobarla.
tema: vivienda
ambito: estatal
efectos:
  - cuando: { arrendador: [si] }
    el_si: perjudica
    justificacion: >-
      Quien alquila una vivienda no podría usar contratos de temporada o por habitaciones para
      quedar fuera de la duración mínima y de la contención de rentas.
    base: >-
      Modificación de los arts. 2, 3.2 y 4 y nuevo art. 9 bis de la Ley de Arrendamientos Urbanos.
justificacion: >-
  Es la propuesta de la XV sobre el alquiler de temporada y de habitaciones, una vía que la ley de
  vivienda dejaba abierta.
extracto: >-
  [Exposición de motivos] «En el caso de los territorios con la aplicación de las zonas
  tensionadas, el arrendador puede elegir entre realizar contratos largos a precio regulado o
  realizar contratos cortos sin ningún tope de precios, sin que ello tenga ninguna repercusión.»
  [Art. 2.1 LAU] «Se considera arrendamiento de vivienda aquel arrendamiento que recae sobre una
  edificación habitable cuyo destino primordial sea satisfacer la necesidad permanente de vivienda
  habitual del arrendatario, incluido el arrendamiento de una habitación o estancia de la
  vivienda.» [Art. 2.3 LAU] «Asimismo, tendrán esta consideración los arrendamientos de fincas
  urbanas destinados a la vivienda por motivos temporales, tales como actividades profesionales,
  estudios, atención o asistencia médica u otros análogos; así como aquellos celebrados por
  temporada […]. En caso de no quedar debidamente acreditadas, se presumirá que dicho contrato es
  de vivienda habitual.» [Art. 9 bis.1 LAU] «[…] la duración del arrendamiento será libremente
  pactada por las partes, no pudiendo exceder de seis meses, en atención a las causas que lo
  motiven.» [Art. 9 bis.2 LAU] «No obstante lo anterior, siempre que su duración exceda de seis
  meses o se encadenen más de dos contratos consecutivos, el primero se entenderá celebrado como
  un contrato de arrendamiento de vivienda habitual, y le serán de aplicación todos los preceptos
  previstos para dichos contratos, incluido el plazo mínimo y las prórrogas previstas en los
  artículos 9 y 10.»
