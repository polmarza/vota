votacion: XV-129-3
url: "https://www.congreso.es/es/opendata/votaciones?p_p_id=votaciones&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&targetLegislatura=XV&targetDate=09/09/2025"
texto: https://www.boe.es/eli/es/rdl/2025/07/29/9
iniciativa: "Real decreto-ley del Gobierno"
fecha: 2025-09-09
titulo_oficial: >-
  Real Decreto-ley 9/2025, de 29 de julio, por el que se amplía el permiso de nacimiento y
  cuidado, mediante la modificación del texto refundido de la Ley del Estatuto de los
  Trabajadores, aprobado por el Real Decreto Legislativo 2/2015, de 23 de octubre, el texto
  refundido de la Ley del Estatuto Básico del Empleado Público, aprobado por el Real Decreto
  Legislativo 5/2015, de 30 de octubre, y el texto refundido de la Ley General de la Seguridad
  Social, aprobado por el Real Decreto Legislativo 8/2015, de 30 de octubre, para completar la
  transposición de la Directiva (UE) 2019/1158 del Parlamento Europeo y del Consejo, de 20 de
  junio de 2019, relativa a la conciliación de la vida familiar y la vida profesional de los
  progenitores y los cuidadores, y por la que se deroga la Directiva 2010/18/UE del Consejo.
titulo: "Permiso por nacimiento de 19 semanas"
resumen: >-
  Amplía el permiso por nacimiento y cuidado de 16 a 19 semanas por progenitor, dos de ellas para
  usar hasta que el menor cumpla ocho años, y alarga el de las familias monoparentales.
que_significa_si: >-
  Votar sí era convalidar el decreto ley, es decir, mantenerlo en vigor.
tema: familia
ambito: estatal
efectos:
  - cuando: { hijos: [pequenos] }
    el_si: favorece
    justificacion: >-
      Quien tiene un hijo pequeño dispone de tres semanas más de permiso retribuido por nacimiento
      y cuidado.
    base: >-
      Art. 1, que modifica el art. 48.4 del Estatuto de los Trabajadores, y concordantes del
      Estatuto Básico del Empleado Público y de la Ley General de la Seguridad Social.
justificacion: >-
  Es la ampliación del permiso por nacimiento de la XV.
extracto: >-
  [Exposición de motivos] «incrementa, con carácter general, la duración del permiso de nacimiento y
  cuidados, adopción, guarda con fines de adopción y acogimiento en tres semanas, las dos últimas
  con un diseño más flexible» [Artículo primero, art. 48.4 del Estatuto de los Trabajadores] «El
  nacimiento, que comprende el parto y el cuidado de menor, suspenderá el contrato de trabajo de la
  madre biológica y el del progenitor distinto de la madre biológica durante diecinueve semanas. En
  el supuesto de monoparentalidad, por existir una única persona progenitora, el periodo de
  suspensión será de treinta y dos semanas.» «c) Dos semanas, cuatro en el caso de monoparentalidad,
  para el cuidado del menor que podrán distribuirse a voluntad de la persona trabajadora, en
  períodos semanales de forma acumulada o interrumpida hasta que el hijo o la hija cumpla los ocho
  años.» [Artículo segundo, art. 49.a) del Estatuto Básico del Empleado Público] «a) Permiso por
  nacimiento para la madre biológica: tendrá una duración de diecinueve semanas. En el supuesto de
  monoparentalidad, por existir una única persona progenitora, el permiso será de treinta y dos
  semanas.» [Disposición transitoria única] «El disfrute de dichas semanas de suspensión de contrato
  de trabajo o del permiso por nacimiento y cuidado de menor, así como la prestación económica
  correspondiente, podrá solicitarse a partir del 1 de enero de 2026»
