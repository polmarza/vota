votacion: XV-91-12
url: "https://www.congreso.es/es/opendata/votaciones?p_p_id=votaciones&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&targetLegislatura=XV&targetDate=12/02/2025"
texto: https://www.boe.es/eli/es/rdl/2025/01/28/1
iniciativa: "Real decreto-ley del Gobierno"
fecha: 2025-02-12
titulo_oficial: >-
  Real Decreto-ley 1/2025, de 28 de enero, por el que se aprueban medidas urgentes en materia
  económica, de transporte, de Seguridad Social, y para hacer frente a situaciones de
  vulnerabilidad.
titulo: "Pensiones, transporte y bono social de 2025"
resumen: >-
  Aprobado tras caer el decreto ómnibus de diciembre, sube las pensiones contributivas un 2,8 % en
  2025, mantiene los descuentos en abonos de transporte público (Cercanías, Media Distancia,
  autobuses estatales y ayudas a los transportes autonómicos y locales), prorroga la suspensión de
  desahucios de hogares vulnerables hasta final de 2025 y fija los descuentos del bono social
  eléctrico y la prohibición de cortar suministros a consumidores vulnerables en 2025. Se convalidó.
que_significa_si: >-
  Votar sí era convalidar el decreto ley, es decir, mantenerlo en vigor.
tema: pensiones
ambito: estatal
efectos:
  - cuando: { trabajo: [jubilado] }
    el_si: favorece
    justificacion: >-
      Quien cobra una pensión mantenía la subida del 2,8 % de 2025 y la de las pensiones mínimas.
    base: >-
      Art. 65 del Real Decreto-ley 1/2025 (revalorización de pensiones y otras prestaciones
      públicas).
  - cuando: { transporte: [publico] }
    el_si: favorece
    justificacion: >-
      Quien usa el transporte público mantenía los descuentos en abonos y títulos multiviaje, como
      el abono mensual de Cercanías a 20 euros y la gratuidad para menores de 14 años.
    base: >-
      Arts. 7, 18, 20 y 63 del Real Decreto-ley 1/2025 (ayudas y descuentos en abonos y títulos
      multiviaje durante 2025).
justificacion: >-
  Es el decreto que finalmente subió las pensiones y mantuvo las ayudas al transporte de 2025, con
  efecto directo en pensionistas y usuarios del transporte público.
extracto: >-
  [Art. 65.1] «Las pensiones abonadas por el sistema de la Seguridad Social, en su modalidad
  contributiva, […] se revalorizarán en 2025 con carácter general el 2,8 por ciento respecto del
  importe que tuvieran a 31 de diciembre de 2024» [Art. 65.3] «La cuantía mínima de las pensiones
  contributivas del sistema de la Seguridad Social y Clases Pasivas se incrementará en el año 2025
  en función del tipo de pensión» [Art. 63.1] «Se restablece con efectos desde el 23 de enero de
  2025 hasta el 30 de junio de 2025 la vigencia de las ayudas previstas en los artículos 64 al 70
  del Real Decreto-ley 8/2023, de 27 de diciembre» [Art. 7.2] «a) Gratuidad a población infantil
  hasta los catorce años.» [Art. 18.2.b] «Un abono mensual nominativo con descuento del 50 %
  calculado sobre la tarifa máxima admisible» [Art. 20.2.b] «Un abono mensual nominativo de tarifa
  única 20 euros» [Art. 72.Uno (art. 1.1 del Real Decreto-ley 11/2020)] «Desde la entrada en vigor
  del presente real decreto-ley y hasta el 31 de diciembre de 2025, en todos los juicios verbales
  que versen sobre reclamaciones de renta o cantidades debidas por el arrendatario, […] la persona
  arrendataria podrá instar, de conformidad con lo previsto en este artículo, un incidente de
  suspensión extraordinaria del desahucio o lanzamiento ante el Juzgado por encontrarse en una
  situación de vulnerabilidad económica» [Art. 74] «La solicitud de compensación podrá presentarse
  hasta el 31 de enero de 2026, debiendo formular el arrendador una exposición razonada y
  justificada de la compensación que considere procedente» [Art. 82.1] «a) Con efectos desde el 1 de
  enero de 2025 y hasta el 30 de junio de 2025, el descuento correspondiente al consumidor
  vulnerable será del 50 por ciento. En el caso del consumidor vulnerable severo, el descuento será
  del 65 por ciento.» «b) Con efectos desde el 1 de julio de 2025 y hasta el 31 de diciembre de
  2025, el descuento correspondiente al consumidor vulnerable será del 42,5 por ciento.» [Art. 83]
  «La garantía de suministro de agua y energía a consumidores vulnerables […] se aplicará desde 1 de
  enero hasta el 31 de diciembre de 2025.»
