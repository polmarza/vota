votacion: XV-49-21
url: "https://www.congreso.es/es/opendata/votaciones?p_p_id=votaciones&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&targetLegislatura=XV&targetDate=20/06/2024"
texto: https://www.boe.es/eli/es/rdl/2024/06/04/3
iniciativa: "Real decreto-ley del Gobierno"
fecha: 2024-06-20
titulo_oficial: >-
  Real Decreto-ley 3/2024, de 4 de junio, de medidas de promoción del uso del transporte público
  colectivo terrestre por parte de los jóvenes para los viajes realizados en el periodo estival de
  2024.
titulo: "Verano Joven 2024"
resumen: >-
  Descuentos en autobús y tren para jóvenes de 18 a 30 años durante el verano de 2024.
que_significa_si: >-
  Votar sí era convalidar el decreto ley, es decir, mantenerlo en vigor.
tema: transporte
ambito: estatal
efectos:
  - cuando: { edad: [menos-30] }
    el_si: favorece
    justificacion: >-
      Quien tiene menos de 30 años tuvo descuentos en los viajes de autobús y tren del verano de
      2024.
    base: >-
      Arts. 1 a 4 del Real Decreto-ley 3/2024.
justificacion: >-
  Es la medida de transporte dirigida específicamente a los jóvenes en la XV.
extracto: >-
  [Art. 1.1] «Los descuentos a aplicar en el precio de los billetes en los servicios de transporte
  público colectivo terrestre regulados en los artículos 2 a 4 de este capítulo serán de
  aplicación a las personas que reúnan los siguientes requisitos: a) Haber nacido entre el 1 de
  enero de 1994 y el 31 de diciembre de 2006.» [Art. 1.2] «El descuento se aplicará sobre el
  precio de los billetes que tengan fecha de viaje entre el 1 de julio de 2024 y el 30 de
  septiembre de 2024.» [Art. 2.1] «Renfe Viajeros S.M.E., SA, aplicará […] un descuento del 90 %
  sobre el precio del billete sencillo y el billete de ida y vuelta en los servicios de transporte
  ferroviario de viajeros de media distancia, incluyendo los servicios de proximidad, prestados
  sobre la red convencional y la red de ancho métrico.» [Art. 2.2] «[…] un descuento del 50 % en
  el precio de los billetes sencillos y los billetes de ida y vuelta de los servicios Avant.»
  [Art. 3.1] «Las empresas ferroviarias que prestan servicios de transporte ferroviario de
  viajeros no sometidos a obligaciones de servicio público sobre la Red Ferroviaria de Interés
  General […] podrán aplicar […] un descuento del 50 % en el precio ofertado en el momento de la
  compra en las tarifas comerciales de cada operador, con un descuento máximo de 30 euros por
  trayecto.» [Art. 4.1] «Las empresas concesionarias de servicios públicos de transporte regular
  de viajeros de uso general por carretera de competencia estatal […] deberán aplicar, a las
  personas que cumplan los requisitos establecidos en el artículo 1, durante el periodo y con las
  condiciones establecidas en dicho artículo, un descuento del 90 % del precio en los billetes
  sencillos y en los billetes de ida y vuelta […].»
