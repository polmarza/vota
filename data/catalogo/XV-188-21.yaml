votacion: XV-188-21
url: "https://www.congreso.es/es/opendata/votaciones?p_p_id=votaciones&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&targetLegislatura=XV&targetDate=18/06/2026"
texto: https://www.congreso.es/public_oficiales/L15/CONG/BOCG/A/BOCG-15-A-93-1.PDF
iniciativa: "Proyecto de ley del Gobierno"
fecha: 2026-06-18
titulo_oficial: >-
  Proyecto de Ley por la que se modifican la Ley Orgánica 2/2006, de 3 de mayo, de Educación, y la
  Ley 4/2019, de 7 de marzo, de mejora de las condiciones para el desempeño de la docencia y la
  enseñanza en el ámbito de la educación no universitaria, y se adoptan otras medidas para la mejora
  del sistema educativo
titulo: "Máximo de alumnos por clase (2026)"
resumen: >-
  Debate de totalidad del proyecto que fija un máximo de 22 alumnos por aula en primaria y 25 en
  la ESO, de forma progresiva desde el curso 2027-2028 en primaria y desde el 2028-2029 en la ESO,
  y, desde el curso 2026-2027, limita con carácter general las horas lectivas semanales del
  profesorado de los centros públicos a 23 en infantil, primaria y educación especial y a 18 en el
  resto de enseñanzas. Las enmiendas pedían devolverlo al Gobierno; se rechazaron y el proyecto
  siguió su tramitación.
que_significa_si: >-
  Votar sí era apoyar la enmienda a la totalidad, es decir, devolver el proyecto al Gobierno, lo que
  pone fin a su tramitación.
tema: educacion
ambito: estatal
efectos:
  - cuando: { hijos: [menores] }
    el_si: perjudica
    justificacion: >-
      Devolver el proyecto suprimía el nuevo máximo de alumnos por aula (22 en primaria y 25 en la ESO)
      en las clases de los hijos en edad escolar.
    base: >-
      Disposición final primera (art. 157.1.a de la Ley Orgánica de Educación), art. 2 y disposición
      final cuarta (calendario) del proyecto.
  - cuando: { sector: [educacion], trabajo: [funcionario] }
    el_si: perjudica
    justificacion: >-
      Devolver el proyecto suprimía el límite de horas lectivas semanales del profesorado de los
      centros públicos: 23 en infantil, primaria y educación especial y 18 en el resto de enseñanzas,
      desde el curso 2026-2027.
    base: >-
      Art. 1 del proyecto (artículo único de la Ley 4/2019) y disposición final cuarta.1 (calendario).
justificacion: >-
  Es la reforma educativa de la XV con un efecto directo y medible en las familias con hijos en edad
  escolar; se votó la devolución en el Pleno.
extracto: >-
  [Disposición final primera (art. 157.1.a de la Ley Orgánica de Educación)] «Un número máximo de
  alumnos y alumnas por aula que en la enseñanza obligatoria será de 22 para la educación primaria y
  de 25 para la educación secundaria obligatoria» [Art. 2.1] «Las administraciones educativas, en el
  ejercicio de sus competencias, proveerán los recursos necesarios para garantizar que no se supere
  el número máximo de alumna/os por unidad escolar en la educación primaria y en la educación
  secundaria obligatoria» [Art. 1 (artículo único de la Ley 4/2019)] «La parte lectiva de la jornada
  semanal del personal docente […] en centros públicos será […] a) De veintitrés horas en los
  centros de educación infantil, primaria y especial […] b) De dieciocho horas en los centros que
  impartan el resto de las enseñanzas» [Disposición final cuarta.1] «Las previsiones contenidas en
  el artículo 1 y en el artículo 2.2 de esta ley serán de aplicación desde el curso escolar
  2026/2027.» [Disposición final cuarta.2] «a) Desde el curso escolar
  2027/2028 para su aplicación progresiva en el primer curso del segundo ciclo de etapa de educación
  infantil y el primer curso de la etapa de educación primaria. […] b) Desde el curso escolar
  2028/2029 para su aplicación progresiva en el primer curso de la etapa de educación secundaria
  obligatoria.»
