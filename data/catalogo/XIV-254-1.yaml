votacion: XIV-254-1
url: "https://www.congreso.es/es/opendata/votaciones?p_p_id=votaciones&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&targetLegislatura=XIV&targetDate=25/04/2023"
texto: https://www.congreso.es/public_oficiales/L14/CONG/BOCG/B/BOCG-14-B-259-1.PDF
iniciativa: "Proposición de ley del Grupo Confederal de Unidas Podemos-En Comú Podem-Galicia en Común"
fecha: 2023-04-25
titulo_oficial: >-
  Proposición de Ley del Grupo Parlamentario Confederal de Unidas Podemos-En Comú Podem-Galicia en
  Común, de mejora de las condiciones de trabajo y protección social de las personas trabajadoras
  agrarias por cuenta ajena y de los eventuales agrarios de Andalucía y Extremadura.
titulo: "Nuevo subsidio agrario en Andalucía y Extremadura"
resumen: >-
  Propuesta para sustituir el subsidio agrario y la renta agraria de Andalucía y Extremadura por
  un subsidio especial más alto, del 50 % al 75 % del salario mínimo según las jornadas cotizadas,
  con menos jornadas exigidas para acceder. Cambiaba también el alta en la Seguridad Social de los
  jornaleros. Se admitió a trámite.
que_significa_si: >-
  Votar sí era admitirla a trámite para que el Congreso la debatiera y pudiera aprobarla.
tema: campo
ambito: [andalucia, extremadura]
efectos:
  - cuando: { ccaa: [andalucia, extremadura], campo: [si], trabajo: [asalariado, desempleo] }
    el_si: favorece
    justificacion: >-
      Un jornalero del campo andaluz o extremeño podría cobrar un subsidio por desempleo de entre
      el 50 % y el 75 % del salario mínimo, con solo 30 jornadas cotizadas la primera vez y
      ninguna mínima las siguientes.
    base: >-
      Art. 3, que da nueva redacción al art. 288 de la Ley General de la Seguridad Social, y
      disposición adicional cuarta.
justificacion: >-
  Es la principal iniciativa sobre la protección de los trabajadores eventuales del campo, un
  colectivo numeroso en Andalucía y Extremadura.
