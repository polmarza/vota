votacion: XV-44-1
url: "https://www.congreso.es/es/opendata/votaciones?p_p_id=votaciones&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&targetLegislatura=XV&targetDate=11/06/2024"
texto: https://www.congreso.es/public_oficiales/L15/CONG/BOCG/B/BOCG-15-B-57-1.PDF
iniciativa: "Proposición de ley orgánica del Parlamento de Galicia"
fecha: 2024-06-11
titulo_oficial: >-
  Proposición de Ley del Parlamento de Galicia, Orgánica de transferencia de la titularidad y
  competencias de la autopista del Atlántico (AP-9) a la Comunidad Autónoma de Galicia.
titulo: "Traspaso de la AP-9 a Galicia"
resumen: >-
  Transfiere a Galicia la titularidad de la autopista AP-9 y la competencia sobre su concesión,
  incluidos los peajes y los descuentos, y obliga al Estado a financiar la ampliación de las
  bonificaciones a los usuarios habituales. Se admitió a trámite.
que_significa_si: >-
  Votar sí era admitirla a trámite para que el Congreso la debatiera y pudiera aprobarla.
tema: territorio
ambito: [galicia]
efectos:
  - cuando: { ccaa: [galicia], transporte: [coche] }
    el_si: favorece
    justificacion: >-
      Quien se mueve en coche por Galicia tendría más descuentos en los peajes de la AP-9 si la usa
      con frecuencia, pagados por el Estado.
    base: >-
      Art. 1.3.d) (competencia sobre tarifas, peajes y descuentos) y art. 1.4 (financiación estatal
      de más bonificaciones a usuarios recurrentes) de la proposición.
justificacion: >-
  Es la principal iniciativa sobre infraestructuras de una comunidad en la XV, propuesta por el
  propio Parlamento de Galicia, con efecto directo en quien usa la autopista.
extracto: >-
  [Art. 1.1] «Se transfiere a la Comunidad Autónoma de Galicia la titularidad de la autopista del
  Atlántico (AP-9).» [Art. 1.2] «Se transfieren a la Comunidad Autónoma de Galicia la titularidad
  y las competencias sobre el régimen jurídico de la concesión administrativa para la
  construcción, conservación y explotación de la autopista del Atlántico (AP-9) […]» [Art. 1.3.d)]
  «Las modificaciones que afecten al régimen económico-financiero de la concesión, singularmente
  en lo que incumbe al establecimiento, actualización y supresión de las tarifas y peajes, así
  como la aplicación de programas de descuento […]» [Art. 1.4] «Con la finalidad de garantizar el
  imprescindible equilibrio territorial e igualdad de oportunidades de Galicia con el resto de
  España, la Administración del Estado dotará a la Comunidad Autónoma de Galicia de los medios
  económicos necesarios para ampliar las bonificaciones a las personas usuarias recurrentes,
  aumentándolas para todas las categorías de vehículos pesados, y extendiéndolas a familias
  numerosas y a viajes nocturnos.»
