votacion: XIV-168-22
url: "https://www.congreso.es/es/opendata/votaciones?p_p_id=votaciones&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&targetLegislatura=XIV&targetDate=31/03/2022"
texto: https://www.boe.es/eli/es/rdl/2022/03/15/4
iniciativa: "Real decreto-ley del Gobierno"
fecha: 2022-03-31
titulo_oficial: >-
  Real Decreto-ley 4/2022, de 15 de marzo, por el que se adoptan medidas urgentes de apoyo al
  sector agrario por causa de la sequía.
titulo: "Ayudas al campo por la sequía (2022)"
resumen: >-
  Ayudas a agricultores y ganaderos afectados por la sequía: exenciones en el canon del agua,
  préstamos con aval público, rebajas fiscales y ayudas directas a la ganadería.
que_significa_si: >-
  Votar sí era convalidar el decreto ley, es decir, mantenerlo en vigor.
tema: campo
ambito: estatal
efectos:
  - cuando: { campo: [si] }
    el_si: favorece
    justificacion: >-
      Quien vive del campo pudo pedir ayudas, préstamos avalados y rebajas en el agua y en los
      impuestos por la sequía.
    base: >-
      Arts. 1 a 13 del Real Decreto-ley 4/2022.
justificacion: >-
  Es la principal medida de apoyo al sector agrario de la XIV.
