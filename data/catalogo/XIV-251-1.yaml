votacion: XIV-251-1
url: "https://www.congreso.es/es/opendata/votaciones?p_p_id=votaciones&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&targetLegislatura=XIV&targetDate=18/04/2023"
texto: https://www.congreso.es/public_oficiales/L14/CONG/BOCG/B/BOCG-14-B-282-1.PDF
iniciativa: "Proposición de ley del Grupo Vox"
fecha: 2023-04-18
titulo_oficial: >-
  Proposición de Ley del Grupo Parlamentario VOX, Orgánica de cuidados paliativos en el proceso
  final de la vida.
titulo: "Ley de cuidados paliativos de Vox"
resumen: >-
  Reconocía el derecho a cuidados paliativos, también en casa, con permisos y reducción de jornada
  para los familiares que cuidan a un enfermo en el final de su vida y trámite urgente de la
  dependencia para estos pacientes. También derogaba la ley de eutanasia. No se admitió a trámite.
que_significa_si: >-
  Votar sí era admitirla a trámite para que el Congreso la debatiera y pudiera aprobarla.
tema: cuidados
ambito: estatal
efectos:
  - cuando: { cuidados: [si] }
    el_si: favorece
    justificacion: >-
      Quien cuida de un familiar en cuidados paliativos podría reducir su jornada o tener días de
      permiso, y la dependencia del enfermo se resolvería por la vía urgente.
    base: >-
      Art. 12.4 y disposiciones finales primera (Ley 39/2006), segunda (art. 37 del Estatuto de los
      Trabajadores) y tercera (art. 48 del Estatuto Básico del Empleado Público).
justificacion: >-
  Es la propuesta de cuidados al final de la vida de las dos legislaturas, de un grupo de la
  oposición.
