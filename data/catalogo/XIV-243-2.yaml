votacion: XIV-243-2
url: "https://www.congreso.es/es/opendata/votaciones?p_p_id=votaciones&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&targetLegislatura=XIV&targetDate=14/03/2023"
texto: https://www.congreso.es/public_oficiales/L14/CONG/BOCG/B/BOCG-14-B-247-1.PDF
iniciativa: "Proposición de ley de los Grupos Republicano y Euskal Herria Bildu"
fecha: 2023-03-14
titulo_oficial: >-
  Proposición de Ley de los Grupos Parlamentarios Republicano y Euskal Herria Bildu, para la
  recuperación y ampliación de los derechos laborales.
titulo: "Despido de 45 días y salarios de tramitación"
resumen: >-
  Reformaba el Estatuto de los Trabajadores en varios frentes. En el despido, subía la
  indemnización por despido improcedente a 45 días por año trabajado con un máximo de 42
  mensualidades, recuperaba los salarios de tramitación, volvía a exigir autorización de la
  autoridad laboral para los despidos colectivos y declaraba nulo el despido de quien tuviera un
  contrato temporal sin causa legal. Además, impedía que un convenio de empresa rebajara las
  condiciones del convenio sectorial, daba a la plantilla de contratas y subcontratas las
  condiciones esenciales de la empresa principal y sacaba la cuantía del salario de lo que la
  empresa puede cambiar por modificación sustancial de las condiciones de trabajo. No se admitió a
  trámite.
que_significa_si: >-
  Votar sí era admitirla a trámite para que el Congreso la debatiera y pudiera aprobarla.
tema: empleo
ambito: estatal
efectos:
  - cuando: { trabajo: [asalariado] }
    el_si: favorece
    justificacion: >-
      Quien trabaja por cuenta ajena cobraría 45 días por año trabajado y los salarios de
      tramitación si le despiden de forma improcedente, y un despido colectivo necesitaría
      autorización de la autoridad laboral.
    base: >-
      Art. 1, apartados Seis y Ocho, que modifican los arts. 51 y 56 del Estatuto de los
      Trabajadores.
  - cuando: { contrata: [empresa] }
    el_si: perjudica
    justificacion: >-
      Quien tiene personas contratadas en su empresa tendría que pagar 45 días por año trabajado y
      los salarios de tramitación si un despido se declara improcedente, y pedir autorización a la
      autoridad laboral para un despido colectivo.
    base: >-
      Art. 1, apartados Seis y Ocho, que modifican los arts. 51 y 56 del Estatuto de los
      Trabajadores.
justificacion: >-
  Es la propuesta de la oposición de izquierdas para revertir el abaratamiento del despido de 2012,
  que la reforma laboral de 2021 no tocó.
extracto: >-
  [Art. 1.Ocho (art. 56.1 ET)] «Una indemnización de cuarenta y cinco días de […] por año de
  servicio, prorrateándose por meses los periodos de tiempo […] hasta un máximo de cuarenta y dos
  mensualidades.» «Una cantidad igual a la suma de los salarios dejados de percibir desde la fecha
  del despido hasta la notificación de la sentencia que declarare la improcedencia» [Art. 1.Seis
  (art. 51.2 ET)] «El empresario que tenga la intención de efectuar un despido colectivo deberá
  solicitar autorización para la extinción de los contratos de trabajo conforme al procedimiento de
  regulación de empleo» [Art. 1.Siete (art. 55.5 ET)] «Será también nulo el despido en los
  siguientes supuestos:» «El de las personas trabajadoras que hayan suscrito un contrato de duración
  determinada, respecto de aquellos contratos concertados al margen de las razones justificativas
  previstas en las disposiciones legales» [Art. 1.Once (art. 84.2 ET)] «no podrá implicar rebajas en
  las condiciones de empleo y de trabajo disfrutadas en los convenios sectoriales de aplicación,
  siendo derechos reconocidos en convenio sectorial norma mínima, irrenunciables y, por tanto,
  indisponibles por convenios de ámbito inferior.» [Art. 1.Cuatro (art. 42.6 ET)] «Las personas
  trabajadoras al servicio de cualquier empresa contratista o subcontratista tendrán derecho a la
  aplicación de las condiciones esenciales de trabajo y empleo que les corresponderían de haber sido
  contratados directamente por la empresa principal para ocupar el mismo puesto.» [Art. 1.Tres (art.
  41.1 ET; la letra d vigente dice «Sistema de remuneración y cuantía salarial»)] «a) Jornada de
  trabajo. b) Horario y distribución del tiempo de trabajo. c) Régimen de trabajo a turnos. d) Sistema
  de remuneración. e) Sistema de trabajo y rendimiento.»
