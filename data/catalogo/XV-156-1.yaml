votacion: XV-156-1
url: "https://www.congreso.es/es/opendata/votaciones?p_p_id=votaciones&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&targetLegislatura=XV&targetDate=27/01/2026"
texto: https://www.boe.es/eli/es/rdl/2025/12/23/16
iniciativa: "Real decreto-ley del Gobierno"
fecha: 2026-01-27
titulo_oficial: >-
  Real Decreto-ley 16/2025, de 23 de diciembre, por el que se prorrogan determinadas medidas para
  hacer frente a situaciones de vulnerabilidad social, y se adoptan medidas urgentes en materia
  tributaria y de Seguridad Social.
titulo: "Decreto ómnibus: pensiones, bono social y desahucios (2026)"
resumen: >-
  Subía las pensiones contributivas un 2,7 % en 2026, alargaba la suspensión de desahucios de
  hogares vulnerables hasta final de 2026, fijaba los descuentos del bono social eléctrico (42,5 %
  y 57,5 %) y la prohibición de cortar suministros a consumidores vulnerables, y prorrogaba los
  límites que permiten a los autónomos tributar por módulos, entre otras medidas fiscales. El
  Congreso no lo convalidó; después el Gobierno aprobó dos decretos separados, uno de pensiones y
  otro de bono social, desahucios y módulos.
que_significa_si: >-
  Votar sí era convalidar el decreto ley, es decir, mantenerlo en vigor.
tema: pensiones
ambito: estatal
efectos:
  - cuando: { trabajo: [jubilado] }
    el_si: favorece
    justificacion: >-
      Quien cobra una pensión tenía garantizada desde enero la subida del 2,7 % de 2026 y la de las
      pensiones mínimas y no contributivas.
    base: >-
      Art. 8 del Real Decreto-ley 16/2025 (revalorización de las pensiones y de otras prestaciones
      públicas).
  - cuando: { vivienda: [alquiler], ingresos: [hasta-16k] }
    el_si: favorece
    justificacion: >-
      Quien vive de alquiler con ingresos bajos podía pedir que se suspendiera su desahucio hasta
      final de 2026 si acreditaba vulnerabilidad económica.
    base: >-
      Art. 1, apartado Uno, del Real Decreto-ley 16/2025 (nueva redacción del art. 1 del Real
      Decreto-ley 11/2020: suspensión de desahucios hasta el 31-12-2026).
  - cuando: { arrendador: [si] }
    el_si: perjudica
    justificacion: >-
      Quien alquila una vivienda podía ver suspendido hasta el 31-12-2026 el desahucio de un inquilino
      vulnerable que no paga, aunque con derecho a pedir una compensación pública.
    base: >-
      Art. 1, apartado Uno, del Real Decreto-ley 16/2025 (nueva redacción del art. 1 del Real
      Decreto-ley 11/2020: suspensión de desahucios hasta el 31-12-2026) y art. 2 (compensación
      al arrendador, disposición adicional segunda del Real Decreto-ley 37/2020).
  - cuando: { trabajo: [autonomo] }
    el_si: favorece
    justificacion: >-
      El autónomo que tributa por módulos podía seguir en ese régimen en 2026 con los límites de
      facturación ampliados (250.000 euros en lugar de 150.000).
    base: >-
      Art. 14, apartado Cuatro (disposición transitoria trigésima segunda de la Ley del IRPF), y
      art. 12 (disposición transitoria decimotercera de la Ley del IVA) del Real Decreto-ley
      16/2025.
justificacion: >-
  Es el decreto de fin de 2025 con la subida de las pensiones de 2026 que el Congreso no convalidó;
  afecta directamente a pensionistas, inquilinos vulnerables, arrendadores y autónomos en módulos.
extracto: >-
  [Art. 8.1] «Las pensiones abonadas por el sistema de la Seguridad Social, en su modalidad
  contributiva, así como las pensiones ordinarias y extraordinarias del Régimen de Clases Pasivas
  del Estado se revalorizarán en 2026 con carácter general el 2,7 por ciento» [Art. 8.3] «La cuantía
  mínima de las pensiones contributivas del sistema de la Seguridad Social y de las pensiones de
  Clases Pasivas del Estado se incrementará en el año 2026» [Art. 8.5] «Las pensiones no
  contributivas del sistema de la Seguridad Social de incapacidad y jubilación tendrán un importe
  anual de 8.803,20 euros.» [Art. 5.1] «El descuento correspondiente al consumidor vulnerable será
  del 42,5 por ciento. En el caso del consumidor vulnerable severo, el descuento será del 57,5 por
  ciento.» [Art. 6] «La garantía de suministro de agua y energía a consumidores vulnerables
  establecida en el artículo 4 del Real Decreto-ley 8/2021 […] se aplicará desde 1 de enero de 2025
  hasta el 31 de diciembre de 2026» [Art. 1.Uno, art. 1.1 del Real Decreto-ley 11/2020] «Desde la
  entrada en vigor del presente real decreto-ley y hasta el 31 de diciembre de 2026, en todos los
  juicios verbales que versen sobre reclamaciones de renta o cantidades debidas por el arrendatario
  […] la persona arrendataria podrá instar […] un incidente de suspensión extraordinaria del
  desahucio o lanzamiento ante el Juzgado por encontrarse en una situación de vulnerabilidad
  económica que le imposibilite encontrar una alternativa habitacional» [Art. 2, disposición
  adicional segunda.2 del Real Decreto-ley 37/2020] «La compensación consistirá en el valor medio
  que correspondería a un alquiler de vivienda en el entorno en que se encuentre el inmueble […] más
  los gastos corrientes de la vivienda que acredite haber asumido el arrendador» [Art. 14.Cuatro,
  disposición transitoria trigésima segunda de la Ley del IRPF] «Para los ejercicios 2016 a 2026,
  ambos inclusive, las magnitudes de 150.000 y 75.000 euros a que se refiere el apartado a’) de la
  letra b) de la norma 3.ª del apartado 1 del artículo 31 de esta Ley, quedan fijadas en 250.000 y
  125.000 euros, respectivamente.» [Art. 12, disposición transitoria decimotercera de la Ley del
  IVA] «Para los ejercicios 2016 a 2026, ambos inclusive, la magnitud de 150.000 euros […] queda
  fijada en 250.000 euros.»
