votacion: XV-137-2
url: "https://www.congreso.es/es/opendata/votaciones?p_p_id=votaciones&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&targetLegislatura=XV&targetDate=14/10/2025"
texto: https://www.congreso.es/public_oficiales/L15/CONG/BOCG/B/BOCG-15-B-243-1.PDF
iniciativa: "Proposición de ley del Grupo Popular"
fecha: 2025-10-14
titulo_oficial: >-
  Proposición de Ley del Grupo Parlamentario Popular en el Congreso, de Conciliación y
  Corresponsabilidad Familiar.
titulo: "Ley de conciliación del PP"
resumen: >-
  Medidas de conciliación y apoyo a las familias: subía la deducción por maternidad en el IRPF
  hasta 1.800 euros por hijo menor de tres años, ampliaba a 26 semanas el permiso de las familias
  monoparentales, pedía al Gobierno retribuir parte del permiso parental y permitía bonificar el IBI a familias
  numerosas y monoparentales. No se admitió a trámite.
que_significa_si: >-
  Votar sí era admitirla a trámite para que el Congreso la debatiera y pudiera aprobarla.
tema: familia
ambito: estatal
efectos:
  - cuando: { hijos: [pequenos] }
    el_si: favorece
    justificacion: >-
      Las madres de hijos menores de tres años que trabajan o cobran el paro (o el padre, si la
      madre fallece o él tiene la custodia exclusiva) podrían deducirse hasta 1.800 euros al año
      por cada uno en el IRPF.
    base: >-
      Disposición final tercera, apartado Uno, de la proposición (art. 81 de la Ley del IRPF).
justificacion: >-
  Es la principal propuesta de la oposición sobre familia en la XV.
extracto: >-
  [Disposición final tercera.Uno, art. 81.1 de la Ley del IRPF] «Las mujeres con hijos menores de
  tres años con derecho a la aplicación del mínimo por descendientes previsto en el artículo 58 de
  esta ley, que en el momento del nacimiento del menor perciban prestaciones contributivas o
  asistenciales del sistema de protección de desempleo, o que en dicho momento o en cualquier
  momento posterior estén dadas de alta en el régimen correspondiente de la Seguridad Social o
  mutualidad con un período mínimo, en este último caso, de 30 días cotizados, podrán minorar la
  cuota diferencial de este Impuesto hasta en 1.800 euros anuales por cada hijo menor de tres años
  hasta que el menor alcance los tres años de edad.» «En caso de fallecimiento de la madre, o cuando
  la guarda y custodia se atribuya de forma exclusiva al padre o, en su caso, a un tutor, siempre
  que cumpla los requisitos previstos en este artículo, este tendrá derecho a la práctica de la
  deducción pendiente.» [Disposición final primera.Uno, art. 48.10 del Estatuto de los Trabajadores]
  «El permiso de paternidad o maternidad por parto o adopción regulado en el presente artículo
  tendrá una duración de veintiséis semanas para los padres o madres de familias monoparentales»
  [Disposición adicional séptima] «El Gobierno impulsará, en el marco del diálogo social y de forma
  inmediata a la entrada en vigor de esta ley, la modificación de las normas laborales y
  estatutarias para […] las condiciones de retribución del periodo mínimo no transferible de 8
  semanas» [Disposición final cuarta, art. 74.4 de la Ley Reguladora de las Haciendas Locales] «las
  ordenanzas fiscales podrán regular una bonificación de hasta el 90 por ciento de la cuota íntegra
  del Impuesto a favor de aquellos sujetos pasivos que ostenten la condición de titulares de familia
  numerosa o de familia monoparental.»
