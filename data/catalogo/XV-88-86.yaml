votacion: XV-88-86
url: "https://www.congreso.es/es/opendata/votaciones?p_p_id=votaciones&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&targetLegislatura=XV&targetDate=19/12/2024"
texto: https://www.boe.es/eli/es/rdl/2024/11/28/8
iniciativa: "Real decreto-ley del Gobierno"
fecha: 2024-12-19
titulo_oficial: >-
  Real Decreto-ley 8/2024, de 28 de noviembre, por el que se adoptan medidas urgentes
  complementarias en el marco del Plan de respuesta inmediata, reconstrucción y relanzamiento frente
  a los daños causados por la Depresión Aislada en Niveles Altos (DANA) en diferentes municipios
  entre el 28 de octubre y el 4 de noviembre de 2024.
titulo: "Coches, material escolar y préstamos a pymes por la DANA de 2024"
resumen: >-
  Tercer paquete de medidas por la DANA de 2024. Crea el Plan Reinicia Auto+, con ayudas de hasta
  10.000 euros, según el tipo de vehículo y su etiqueta ambiental, para comprar uno nuevo o seminuevo
  que sustituya a un vehículo asegurado dañado por la DANA; da
  600 euros por estudiante para reponer libros y material escolar o de estudio a quienes residen en
  los municipios afectados, cumplen los requisitos de las ayudas por daños en la vivienda y las han
  solicitado, y también a los alumnos cuyo material quedó inservible en un centro educativo de esos
  municipios y a los universitarios residentes en ellos que lo perdieron; abre préstamos a interés cero con una parte no reembolsable para las
  pymes de la zona; y excluye las ayudas por daños del cómputo de ingresos para cobrar prestaciones
  de la Seguridad Social. Incluye también líneas de financiación para empresas industriales y
  turísticas y ayudas a entidades culturales y deportivas.
que_significa_si: >-
  Votar sí era convalidar el decreto ley, es decir, mantenerlo en vigor.
tema: catastrofes
ambito: estatal
efectos:
  - cuando: { catastrofe: [dana-2024] }
    el_si: favorece
    justificacion: >-
      Quien sufrió daños por la DANA y tenía un vehículo asegurado que quedó siniestrado puede recibir
      hasta 10.000 euros para comprar otro, y las ayudas por daños que cobre no cuentan como ingresos
      para acceder a prestaciones de la Seguridad Social.
    base: >-
      Arts. 1.2, 2 y 4 y anexos I y II (Plan Reinicia Auto+) y art. 52 (exclusión de las ayudas por
      daños del cómputo de ingresos) del Real Decreto-ley 8/2024.
justificacion: >-
  Añade a las ayudas de la DANA de 2024 medidas distintas de los decretos anteriores, para quien
  perdió el coche.
extracto: >-
  [Art. 1.2] «las medidas de esta norma serán de aplicación exclusivamente a las personas físicas y
  entidades públicas o privadas que hayan sufrido daños en sus bienes o derechos como consecuencia
  directa o indirecta de la DANA» [Art. 2.1] «cuyo objetivo consiste en incentivar la adquisición en
  España de vehículos que sustituyan a los vehículos asegurados siniestrados por los efectos de la
  citada DANA.» [Art. 4.1] «b) Personas físicas mayores de edad residentes en España que no entren
  dentro de la categoría definida en el párrafo anterior.» [Art. 45.1] «se establece la concesión
  directa de subvenciones para estudiantes y familias con hijos e hijas estudiantes, que cumplan las
  siguientes condiciones:» «b) Que cumplan, además, una de las siguientes condiciones: 1.ª Que residan en cualquiera de los municipios incluidos en el anexo
  del Real Decreto-ley 6/2024, de 5 de noviembre; que reúnan, bien ellos directamente o su unidad
  familiar, los requisitos para ser beneficiarios de las ayudas para vivienda establecidas en el
  artículo 3.2 del Real Decreto-ley 6/2024, de 5 de noviembre, y que hayan presentado la solicitud
  de las mismas. 2.ª Que, no teniendo su residencia habitual afectada por los daños provocados por
  la DANA, los libros de texto, material escolar o de estudio de su propiedad, se encontraran en los
  centros educativos situados en los municipios del anexo del Real Decreto-ley 6/2024, de 5 de
  noviembre, y hubieran quedado inservibles.» [Art. 45.2] «Estas ayudas irán destinadas a sufragar
  gastos de reposición de libros de texto y material escolar o de estudio» [Art. 45.4] «La cuantía
  de cada ayuda será de 600 euros por estudiante.» [Art. 46.1] «b) Que residan en cualquiera de los
  municipios incluidos en el anexo del Real Decreto-ley 6/2024, de 5 de noviembre. c) Que cumplan,
  además, una de las siguientes condiciones:» «2.º Que, no reuniendo los requisitos del apartado 1.º
  anterior, hayan perdido el material de estudio de su propiedad o este hubiera quedado
  inservible.» [Art.
  23.2] «estará destinado a ofrecer un préstamo con parte no reembolsable a las pequeñas y medianas
  empresas titulares de actividades o establecimientos industriales, mercantiles, de servicios y
  turísticos» [Art. 52] «se excluirán del cómputo de ingresos las ayudas previstas en los
  correspondientes Reales Decretos-ley que se aprueben como consecuencia de los daños causados por
  la Depresión Aislada en Niveles Altos (DANA)»
