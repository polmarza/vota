votacion: XIV-159-6
url: "https://www.congreso.es/es/opendata/votaciones?p_p_id=votaciones&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&targetLegislatura=XIV&targetDate=10/03/2022"
texto: https://www.boe.es/eli/es/rdl/2022/02/22/2
iniciativa: "Real decreto-ley del Gobierno"
fecha: 2022-03-10
titulo_oficial: >-
  Real Decreto-ley 2/2022, de 22 de febrero, por el que se adoptan medidas urgentes para la
  protección de los trabajadores autónomos, para la transición hacia los mecanismos estructurales
  de defensa del empleo, y para la recuperación económica y social de la isla de La Palma, y se
  prorrogan determinadas medidas para hacer frente a situaciones de vulnerabilidad social y
  económica.
titulo: "Ayudas a autónomos y ERTE (marzo de 2022)"
resumen: >-
  Último paquete de ayudas por la pandemia para autónomos: exime de parte de las cuotas de marzo a
  junio de 2022 a quienes cobraban el cese de actividad y mantiene una prestación del 70 % de la
  base mínima para quienes tengan que cerrar por orden de la autoridad. Ordena además el paso de
  los ERTE de la pandemia a los nuevos ERTE de la reforma laboral.
que_significa_si: >-
  Votar sí era convalidar el decreto ley, es decir, mantenerlo en vigor.
tema: empleo
ambito: estatal
efectos:
  - cuando: { trabajo: [autonomo] }
    el_si: favorece
    justificacion: >-
      Un autónomo que cobraba la prestación por cese de actividad deja de pagar entre el 90 % y el
      25 % de sus cuotas de marzo a junio de 2022, y si le obligan a cerrar cobra el 70 % de la
      base mínima sin pagar cuotas.
    base: >-
      Arts. 1 y 2 del Real Decreto-ley 2/2022.
justificacion: >-
  Es la medida con la que terminaron las ayudas de la pandemia a los autónomos.
